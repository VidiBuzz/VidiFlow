<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidi Ai - API Registration App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .registration-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .service-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .service-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .service-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .service-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .service-name {
            font-weight: 600;
            font-size: 1.2rem;
            color: #333;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: #555;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-input, .form-email {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-email:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .status-pending {
            background: #f59e0b;
        }

        .status-completed {
            background: #10b981;
        }

        .api-key-display {
            margin-top: 1rem;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 8px;
            display: none;
        }

        .api-key-display.visible {
            display: block;
        }

        .key-value {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            color: #667eea;
            word-break: break-all;
        }

        .quick-links {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .quick-links h3 {
            color: #333;
            margin-bottom: 1rem;
        }

        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
        }

        .quick-link {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            background: #f8fafc;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            transition: all 0.2s;
        }

        .quick-link:hover {
            background: #eef2ff;
            transform: translateX(4px);
        }

        .progress-section {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .registration-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Vidi Ai - API Registration Hub</h1>
        <p class="subtitle">Register and collect API keys from all major AI services in one place</p>

        <!-- Progress Section -->
        <div class="progress-section">
            <h3>Registration Progress</h3>
            <p id="progress-text" style="margin-top: 0.5rem; color: #666;">0 of 10 services registered</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <!-- Quick Links Section -->
        <div class="quick-links">
            <h3>⚡ Quick Access - Direct to API Keys</h3>
            <div class="link-grid" id="quick-links">
                <!-- Links will be populated by JavaScript -->
            </div>
        </div>

        <!-- Registration Cards -->
        <div class="registration-grid" id="service-cards">
            <!-- Service cards will be populated by JavaScript -->
        </div>
    </div>

    <script>
        // Configuration for all AI services
        const services = [
            {
                name: 'OpenAI',
                signupUrl: 'https://platform.openai.com/signup',
                apiKeyUrl: 'https://platform.openai.com/api-keys',
                icon: '🤖'
            },
            {
                name: 'Stability AI',
                signupUrl: 'https://stability.ai',
                apiKeyUrl: 'https://platform.stability.ai/account/keys',
                icon: '🌊'
            },
            {
                name: 'fal.ai (FLUX)',
                signupUrl: 'https://fal.ai',
                apiKeyUrl: 'https://fal.ai/dashboard/keys',
                icon: '⚡',
                note: 'FASTEST - Access to 1000+ models'
            },
            {
                name: 'Replicate',
                signupUrl: 'https://replicate.com',
                apiKeyUrl: 'https://replicate.com/account/api-tokens',
                icon: '🔄'
            },
            {
                name: 'Google Gemini',
                signupUrl: 'https://ai.google.dev',
                apiKeyUrl: 'https://aistudio.google.com/apikey',
                icon: '💎'
            },
            {
                name: 'Leonardo.ai',
                signupUrl: 'https://leonardo.ai',
                apiKeyUrl: 'https://app.leonardo.ai/settings/api-keys',
                icon: '🎨'
            },
            {
                name: 'Ideogram',
                signupUrl: 'https://ideogram.ai',
                apiKeyUrl: 'https://ideogram.ai/manage-account',
                icon: '🔤'
            },
            {
                name: 'Adobe Firefly',
                signupUrl: 'https://firefly.adobe.com',
                apiKeyUrl: 'https://developer.adobe.com/firefly-api',
                icon: '🔥'
            },
            {
                name: 'Recraft',
                signupUrl: 'https://recraft.ai',
                apiKeyUrl: '#profile-settings',
                icon: '✏️'
            },
            {
                name: 'HuggingFace',
                signupUrl: 'https://huggingface.co',
                apiKeyUrl: 'https://huggingface.co/settings/tokens',
                icon: '🤗'
            }
        ];

        // User credentials (can be edited)
        const USER_NAME = 'vidiman';
        const USER_EMAIL = 'vidistudios@gmail.com';

        let registeredServices = new Set();

        // Initialize the app
        function init() {
            renderQuickLinks();
            renderServiceCards();
            updateProgress();
        }

        // Render quick links section
        function renderQuickLinks() {
            const container = document.getElementById('quick-links');
            container.innerHTML = services.map(service => `
                <a href="${service.apiKeyUrl}" target="_blank" class="quick-link">
                    <span>${service.icon}</span>
                    <span>${service.name} → API Keys</span>
                </a>
            `).join('');
        }

        // Render service registration cards
        function renderServiceCards() {
            const container = document.getElementById('service-cards');
            container.innerHTML = services.map((service, index) => `
                <div class="service-card" id="card-${index}">
                    <div class="service-header">
                        <div class="service-icon">${service.icon}</div>
                        <div class="service-name">${service.name}</div>
                    </div>
                    
                    ${service.note ? `<p style="color: #f59e0b; font-size: 0.85rem; margin-bottom: 1rem;">${service.note}</p>` : ''}
                    
                    <div class="form-group">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-input" value="${USER_NAME}" readonly>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-email" value="${USER_EMAIL}" readonly>
                    </div>
                    
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="openSignup(${index})">
                            ${service.icon} Register at ${service.name}
                        </button>
                        <button class="btn btn-secondary" onclick="markAsRegistered(${index}, '${service.name}')">
                            ✅ Mark as Done
                        </button>
                    </div>

                    <div class="api-key-display" id="key-display-${index}">
                        <p style="font-size: 0.9rem; color: #666; margin-bottom: 0.5rem;">API Key (optional):</p>
                        <input type="text" class="form-input" placeholder="Paste your API key here..." id="api-key-${index}">
                    </div>

                    <div style="margin-top: 1rem;">
                        <a href="${service.apiKeyUrl}" target="_blank" style="color: #667eea; text-decoration: none;">
                            Direct to API Keys →
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Open signup URL in new tab
        function openSignup(index) {
            const service = services[index];
            window.open(service.signupUrl, '_blank');
        }

        // Mark service as registered
        function markAsRegistered(index, serviceName) {
            if (!registeredServices.has(index)) {
                registeredServices.add(index);
                
                // Show API key input field
                document.getElementById(`key-display-${index}`).classList.add('visible');
                
                // Update card styling
                const card = document.getElementById(`card-${index}`);
                card.style.border = '2px solid #10b981';
                
                updateProgress();
            }
        }

        // Update progress bar and text
        function updateProgress() {
            const total = services.length;
            const completed = registeredServices.size;
            const percentage = (completed / total) * 100;
            
            document.getElementById('progress-text').textContent = 
                `${completed} of ${total} services registered`;
            document.getElementById('progress-fill').style.width = `${percentage}%`;
        }

        // Initialize on page load
        init();
    </script>
</body>
</html>
