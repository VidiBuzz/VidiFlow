<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #111827; /* Dark Gray-Blue */
            color: #F3F4F6; /* Light Gray */
            overflow-x: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.7;
        }

        h1, h2, h3 {
            font-family: 'Kumbh Sans', sans-serif;
        }

        .vidismart-yellow {
            color: #FBBF24; /* Amber-400 */
        }
        
        /* Updated main panel for a sculpted look */
        .vidismart-bg-dark {
             background: linear-gradient(145deg, #2a374a, #1c2635);
             backdrop-filter: blur(10px);
             -webkit-backdrop-filter: blur(10px);
             border: 1px solid #4b5563; /* Slightly lighter border */
             box-shadow: 
                inset 0px 2px 3px rgba(255, 255, 255, 0.06), /* Inner top highlight */
                inset 0px -2px 3px rgba(0, 0, 0, 0.4), /* Inner bottom shadow */
                0 15px 35px rgba(0,0,0,0.5); /* Outer shadow */
        }

        .vidismart-border {
            border-color: #374151; /* Gray-700 */
        }

        /* Gradient for headline */
        .headline-gradient {
            background: linear-gradient(to right, #d4a325, #FBBF24 50%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Updated select for sculpted look and hover glow */
        select, .btn {
            font-family: 'Roboto', sans-serif;
            border-radius: 0.5rem; /* 8px */
            border: 1px solid #1f2937; /* Darker border */
            background-color: #1f2937;
            color: #F3F4F6;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease-in-out;
            box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.5), 0 1px 1px rgba(255,255,255,0.05);
        }
        
        select:hover {
            border-color: #FBBF24;
            box-shadow: 
                inset 0 2px 4px 0 rgba(0,0,0,0.5),
                0 0 15px 2px rgba(251, 191, 36, 0.25); /* Yellow glow */
        }

        select:focus, .btn:focus {
            outline: none;
            border-color: #FBBF24;
            box-shadow: 
                inset 0 2px 4px 0 rgba(0,0,0,0.5),
                0 0 15px 2px rgba(251, 191, 36, 0.25);
        }

        /* Sweep animation for buttons */
        .btn-sweep {
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn-sweep::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(251, 191, 36, 0.4), transparent);
            transition: left 0.6s ease;
            z-index: -1;
        }

        .btn-sweep:hover::before {
            left: 100%;
        }
        
        .btn-sweep:hover {
            border-color: #FBBF24;
        }

        .result-card {
            background-color: rgba(31, 41, 55, 0.8); /* Gray-800 with opacity */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid #374151;
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2), 0 0 15px rgba(251, 191, 36, 0.1);
        }
    </style>
</head>

    <script>
        // --- Three.js Background Animation ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Added antialias: true to smooth out edges
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const clock = new THREE.Clock();

        const geometry = new THREE.PlaneGeometry(2, 2); // Use a simple plane that covers the screen
        const material = new THREE.ShaderMaterial({
            uniforms: {
                u_time: { value: 0.0 },
                u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                u_mouse: { value: new THREE.Vector2(0.5, 0.5) }
            },
            vertexShader: `
                void main() {
                    gl_Position = vec4(position, 1.0);
                }
            `,
            // New, calmer fragment shader for a "lava lamp" effect
            fragmentShader: `
                uniform vec2 u_resolution;
                uniform float u_time;
                
                // Function to create organic noise
                float random (in vec2 st) {
                    return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
                }

                float noise (in vec2 st) {
                    vec2 i = floor(st);
                    vec2 f = fract(st);

                    float a = random(i);
                    float b = random(i + vec2(1.0, 0.0));
                    float c = random(i + vec2(0.0, 1.0));
                    float d = random(i + vec2(1.0, 1.0));

                    vec2 u = f*f*(3.0-2.0*f);
                    return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
                }

                void main() {
                    vec2 st = gl_FragCoord.xy/u_resolution.xy;
                    st.x *= u_resolution.x/u_resolution.y;

                    float n = noise(st * 3.0 + u_time * 0.1);
                    
                    vec3 color1 = vec3(0.0, 0.01, 0.03); // Dark blue
                    vec3 color2 = vec3(0.2, 0.0, 0.3);  // Dark purple
                    vec3 color3 = vec3(0.8, 0.4, 0.1);  // VidiSmart Yellow/Orange hint

                    float mix1 = smoothstep(0.3, 0.5, noise(st * 2.0 + u_time * 0.2));
                    float mix2 = smoothstep(0.6, 0.7, noise(st * 2.5 - u_time * 0.15));

                    vec3 color = mix(color1, color2, mix1);
                    color = mix(color, color3, mix2 * 0.3);

                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });
        const plane = new THREE.Mesh(geometry, material);
        scene.add(plane);

        function animate() {
            requestAnimationFrame(animate);
            material.uniforms.u_time.value = clock.getElapsedTime();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            material.uniforms.u_mouse.value.x = event.clientX / window.innerWidth;
            material.uniforms.u_mouse.value.y = 1.0 - (event.clientY / window.innerHeight);
        }

        window.addEventListener('resize', onWindowResize, false);
        window.addEventListener('mousemove', onMouseMove, false);

        animate();

        // Function to populate select dropdowns
        function populateSelects() {
            for (const category in techData) {
                const selectElement = document.getElementById(category);
                if (selectElement) {
                    techData[category].forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.id;
                        option.textContent = item.name;
                        selectElement.appendChild(option);
                    });
                }
            }
        }

        // Function to generate the results
        function generatePlan() {
            const resultsContainer = document.getElementById('results-container');
            resultsContainer.innerHTML = ''; // Clear previous results

            const selectedIds = {};
            for (const category in techData) {
                const selectElement = document.getElementById(category);
                if (selectElement) {
                    selectedIds[category] = selectElement.value;
                }
            }

            let html = '<h2 class="text-3xl font-bold text-center mb-8"><span class="vidismart-yellow">Your</span> Customized Tech Stack</h2>';
            html += '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">';

            for (const category in selectedIds) {
                const selectedId = selectedIds[category];
                const item = techData[category].find(d => d.id === selectedId);
                
                if (item) {
                    html += `
                        <div class="result-card flex flex-col">
                            <h3 class="text-xl font-bold vidismart-yellow mb-2">${getCategoryTitle(category)}</h3>
                            <h4 class="text-lg font-semibold text-white mb-3">${item.name}</h4>
                            <p class="text-gray-400 flex-grow mb-4">${item.description}</p>
                            <div class="mt-auto flex space-x-3">
                                ${item.website ? `<a href="${item.website}" target="_blank" rel="noopener noreferrer" class="btn btn-sweep w-1/2 text-center font-semibold">Website</a>` : ''}
                                ${item.video ? `<a href="${item.video}" target="_blank" rel="noopener noreferrer" class="btn btn-sweep w-1/2 text-center font-semibold">Watch Video</a>` : ''}
                            </div>
                        </div>
                    `;
                }
            }

            html += '</div>';
            resultsContainer.innerHTML = html;
        }
        
        function getCategoryTitle(categoryKey) {
            const titles = {
                archetype: 'Project Archetype',
                frontend: 'Frontend Framework',
                backend: 'Backend & Database',
                cms: 'Content Management (CMS)',
                'ai-model': 'Primary AI Model',
                'ai-video': 'AI Video Tool',
                crm: 'CRM & Automation',
                payment: 'Payment Gateway',
                hosting: 'Hosting & Deployment'
            };
            return titles[categoryKey] || categoryKey;
        }

        // Event Listener for the button
        document.getElementById('generate-plan').addEventListener('click', generatePlan);

        // Initial population of dropdowns
        window.onload = () => {
            populateSelects();
        };

    </script>
</body>
</html>
