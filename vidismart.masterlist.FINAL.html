            navLink.href = `#${section.id}`;
            navLink.className = `sidebar-link group flex items-center gap-3 px-4 py-2 text-sm font-medium rounded-lg transition-all ${index === 0 ? 'active' : 'text-slate-400 hover:text-white hover:bg-white/5'}`;
            navLink.innerHTML = `<i class="fas ${section.icon} w-5 text-center"></i> <span>${section.title}</span>`;
            navContainer.appendChild(navLink);

            // Section Block
            const sectionDiv = document.createElement('section');
            sectionDiv.id = section.id;
            sectionDiv.className = "scroll-mt-24";

            let itemsHtml = section.items.map(item => {
                // Get actual URL from mapping, or generate fallback
                const url = techUrls[item] || `https://www.google.com/search?q=${encodeURIComponent(item)}`;
                // Extract domain for favicon
                let faviconDomain;
                try {
                    faviconDomain = new URL(url).hostname;
                } catch {
                    faviconDomain = item.toLowerCase().replace(/[^a-z0-9]/g, '') + ".com";
                }
                const logoUrl = `https://www.google.com/s2/favicons?sz=64&domain=${faviconDomain}`;

                return `
                <a href="${url}" target="_blank" rel="noopener noreferrer" class="tech-item p-3 flex items-center gap-4 rounded-xl border border-transparent hover:border-slate-700 cursor-pointer no-underline">

                    <i class="fas fa-external-link-alt external-icon text-slate-500 text-xs ml-auto"></i>

            if (section.id === "backend" || section.id === "languages") extraGrid = generateComparisonGrid();

            sectionDiv.innerHTML = `

                    ${itemsHtml}

                ${extraGrid}
            `;
            sectionsContainer.appendChild(sectionDiv);

        // Intersection Observer for Sidebar Highlighting
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    document.querySelectorAll('.sidebar-link').forEach(link => {
                        link.classList.toggle('active', link.getAttribute('href') === `#${entry.target.id}`);
                    });
                }
            });
        }, { threshold: 0.2 });

        document.querySelectorAll('section').forEach(section => observer.observe(section));
