        - button "Learn More" [ref=e219] [cursor=pointer]
        - generic [ref=e220]:
          - img "ASUS TRX50-SAGE" [ref=e221]
          - heading "What Is It?" [level=4] [ref=e222]
          - paragraph [ref=e223]: The TRX50-SAGE is ASUS's enthusiast Threadripper motherboard with 92 PCIe 5.0 lanes. It supports up to 3 GPUs at full x16, with additional slots running at reduced speeds through the chipset.
          - heading "What Is It Used For?" [level=4] [ref=e224]
          - paragraph [ref=e225]: 2-3 GPU workstations where full bandwidth on all slots isn't critical. Good for development and smaller production deployments.
          - heading "Why It Matters" [level=4] [ref=e226]
          - paragraph [ref=e227]: A solid mid-range option, but lanes drop significantly after the 3rd GPU. Slots 4-5 run at x8/x4 speeds, causing bandwidth contention during large model pre-filling.
          - heading "Pros" [level=4] [ref=e228]
          - paragraph [ref=e229]: + 3x PCIe 5.0 x16 at full speed
          - paragraph [ref=e230]: + Lower cost ($820)
