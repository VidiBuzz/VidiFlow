    - generic [ref=e255]:
      - heading "Why WRX90? - PCIe 5.0 x16 Matters for Multi-GPU AI" [level=3] [ref=e256]
      - paragraph [ref=e257]: In AI inference, PCIe bandwidth directly impacts how quickly model weights can be loaded from system RAM to GPU VRAM during context pre-filling. When running a 72B parameter model across 4 GPUs, each GPU needs to receive ~18GB of weights. At PCIe 4.0 x8 speeds, this takes significantly longer than at PCIe 5.0 x16.
