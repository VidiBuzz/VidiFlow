    - generic [ref=e809]:
      - generic [ref=e810]:
        - generic [ref=e811] [cursor=pointer]: I have $5K, what do I buy? +
        - paragraph [ref=e812]: Start with the 3-card B70 build ($5,800). You'll get 96GB VRAM - enough to run Qwen 72B at Q4_K_M quantization. If budget is tight, start with 2 cards ($1,900) and add more later. The WRX90 board supports up to 7 GPUs, so you can scale incrementally.
      - generic [ref=e813]:
        - generic [ref=e814] [cursor=pointer]: I have $10K, what do I buy? +
        - paragraph [ref=e815]: "Go for the 5-card B70 build ($7,900) and use the remaining $2,100 for upgrades: add more RAM (256GB DDR5 ECC ~$900), larger NVMe (8TB ~$600), or better cooling (Noctua industrial fans ~$150). You'll have 160GB VRAM for maximum model capacity."
      - generic [ref=e816]:
        - generic [ref=e817] [cursor=pointer]: I have $30K, what do I buy? +
        - paragraph [ref=e818]: "Build the 5-card B70 ($7,900) and invest the rest in: dual-node setup (two 4-card builds for redundancy), enterprise networking (10GbE switches), UPS backup, or a 4x RTX 6000 Ada setup if you need NVIDIA-specific features. For most sovereign AI use cases, the 5-card B70 is the sweet spot."
      - generic [ref=e819]:
        - generic [ref=e820] [cursor=pointer]: What model should I run for medical use? +
        - paragraph [ref=e821]: Qwen 72B at Q8_0 quantization is the best choice. It has exceptional medical knowledge, strong reasoning capabilities, and fits in 72GB VRAM (4-card B70 setup). For higher throughput, run Qwen 32B at Q8_0 (32GB) for faster responses on simpler queries. Use YaRN for extended context when processing large medical documents.
      - generic [ref=e822]:
        - generic [ref=e823] [cursor=pointer]: How do I set up llama-server on WSL? +
        - paragraph [ref=e824]: "1. Install WSL2 with Ubuntu. 2. Install Intel GPU drivers for WSL. 3. Build llama.cpp from source with IPEX-LLM support: cmake -DGGML_SYCL=ON .. 4. Download your GGUF model. 5. Run: llama-server -m model.gguf -c 8192 --host 0.0.0.0 --port 8080. 6. Access via browser at http://localhost:8080. The server exposes an OpenAI-compatible API for Hermes Agent and other tools."
      - generic [ref=e825]:
        - generic [ref=e826] [cursor=pointer]: How do I connect Hermes Agent? +
        - paragraph [ref=e827]: "1. Install Hermes Agent via pip: pip install hermes-agent. 2. Configure it to point to your llama-server: set LLM_URL=http://localhost:8080/v1. 3. Enable Mem0 for persistent memory: mem0 init. 4. Define skills (tools) in the Hermes config. 5. Start the agent: hermes start. 6. Connect LTX Desktop to the Hermes API at http://localhost:8000. Your agent is now ready for conversations."
