    - generic [ref=e159]:
      - heading "Why B70? - The Sovereign AI Choice" [level=3] [ref=e160]
      - paragraph [ref=e161]: The Intel Arc Pro B70 is purpose-built for multi-GPU AI inference. Its XMX (Xe Matrix Extensions) engines are hardware-optimized for matrix multiplication - the core operation of neural network inference. Unlike consumer GPUs, the B70 supports native Q8_0 (8-bit) quantization without accuracy loss, meaning a 72B parameter model fits in 72GB of VRAM at near-full precision.
      - paragraph [ref=e162]: At $29.70/GB, it's the most cost-effective professional AI GPU available. Four B70s give you 128GB of VRAM for $3,800 - less than the cost of a single RTX 6000 Ada. The blower cooler design enables dense 1-3-5-7 slot placement in 4U chassis, making it the only viable option for sovereign multi-GPU AI nodes under $10K.
