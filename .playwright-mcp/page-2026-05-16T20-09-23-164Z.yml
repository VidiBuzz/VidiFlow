          - heading "What Is It?" [level=4] [ref=e94]
          - paragraph [ref=e95]: The open-air variant of the Arc Pro B70 uses a triple-fan cooling design instead of a blower. It offers identical performance and 32GB VRAM but is designed for workstations with good case airflow rather than dense server configurations.
          - heading "What Is It Used For?" [level=4] [ref=e96]
          - paragraph [ref=e97]: Single-GPU or dual-GPU workstation setups where thermal density isn't a concern. Ideal for development, testing, and smaller AI deployments that don't require 4+ cards in a single chassis.
          - heading "Why It Matters" [level=4] [ref=e98]
          - paragraph [ref=e99]: Runs cooler and quieter than the blower version in open chassis scenarios. However, for multi-GPU server builds (3+ cards), the blower version is strongly recommended to avoid heat recirculation between cards.
