          - paragraph [ref=e701]: vLLM and llama.cpp are the two primary inference engines for running LLMs locally. llama.cpp (with llama-server) provides CPU+GPU inference with GGUF format support. vLLM offers high-throughput GPU serving with PagedAttention.
