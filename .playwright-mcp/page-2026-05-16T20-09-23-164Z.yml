  - generic [ref=e187]:
    - heading "Motherboard Lane Battle" [level=2] [ref=e188]
    - paragraph [ref=e189]: PCIe lane topology determines whether your multi-GPU AI server runs at full speed or chokes on bandwidth.
    - generic [ref=e190]:
      - generic [ref=e191]:
        - img "ASUS Pro WS WRX90E-SAGE" [ref=e192]
        - generic [ref=e193]: Recommended
        - heading "ASUS Pro WS WRX90E-SAGE SE" [level=3] [ref=e194]
        - paragraph [ref=e195]: 128 PCIe 5.0 Lanes | sWRX8
        - generic [ref=e196]: $1,300
        - button "Learn More" [ref=e197] [cursor=pointer]
        - generic [ref=e198]:
          - img "ASUS WRX90E-SAGE" [ref=e199]
          - heading "What Is It?" [level=4] [ref=e200]
          - paragraph [ref=e201]: The ASUS Pro WS WRX90E-SAGE SE is a workstation motherboard built for AMD Threadripper Pro 7000WX series processors. It provides 128 PCIe 5.0 lanes directly from the CPU, enabling up to 7 GPUs at full x16 bandwidth simultaneously.
          - heading "What Is It Used For?" [level=4] [ref=e202]
          - paragraph [ref=e203]: Multi-GPU AI inference servers, rendering workstations, and scientific computing. The 128-lane topology means every GPU slot runs at full PCIe 5.0 x16 speed.
          - heading "Why It Matters" [level=4] [ref=e204]
          - paragraph [ref=e205]: This is the only motherboard that supports 4+ GPUs at full x16 bandwidth. For AI inference with large models, PCIe bandwidth directly impacts token generation speed.
          - heading "Pros" [level=4] [ref=e206]
          - paragraph [ref=e207]: + 7x PCIe 5.0 x16 slots at full bandwidth
          - paragraph [ref=e208]: + Supports Threadripper Pro 7000WX (up to 96 cores)
          - paragraph [ref=e209]: + 8x DDR5 ECC RDIMM slots (up to 2TB RAM)
          - heading "Cons" [level=4] [ref=e210]
          - paragraph [ref=e211]: "- $1,300 price point"
          - paragraph [ref=e212]: "- Requires sWRX8 CPU (more expensive than TRX50)"
      - generic [ref=e213]:
        - img "ASUS Pro WS TRX50-SAGE" [ref=e214]
        - generic [ref=e215]: Mid-Range
        - heading "ASUS Pro WS TRX50-SAGE" [level=3] [ref=e216]
        - paragraph [ref=e217]: 92 PCIe 5.0 Lanes | sTR5
