          - paragraph [ref=e302]: The 1-3-5-7 slot strategy creates air gaps between GPUs, preventing heat recirculation. Combined with blower-style cards that exhaust directly out the rear, this creates an efficient thermal solution for 4-5 GPU AI nodes.
