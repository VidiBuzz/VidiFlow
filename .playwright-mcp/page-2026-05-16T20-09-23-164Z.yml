          - paragraph [ref=e244]: Intel Xeon W-3400 series motherboard with 112 PCIe 5.0 lanes. An alternative to AMD Threadripper for Intel-based AI workstations.
          - heading "What Is It Used For?" [level=4] [ref=e245]
