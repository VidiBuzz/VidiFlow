          - heading "Why It Matters" [level=4] [ref=e704]
          - paragraph [ref=e705]: These are the engines that power your AI node. llama.cpp's GGUF format enables efficient Q8_0 quantization on Intel XMX, while vLLM's PagedAttention maximizes throughput for multi-user deployments.
