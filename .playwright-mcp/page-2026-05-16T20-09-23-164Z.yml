          - img "Intel Arc Pro B70" [ref=e52]
          - heading "What Is It?" [level=4] [ref=e53]
          - paragraph [ref=e54]: The Intel Arc Pro B70 is Intel's professional workstation GPU, featuring 32GB of GDDR6 memory and a blower-style cooler designed for multi-GPU server deployments. It uses Intel's Xe2 architecture with dedicated XMX (Xe Matrix Extensions) engines optimized for AI inference workloads.
          - heading "What Is It Used For?" [level=4] [ref=e55]
          - paragraph [ref=e56]: Multi-GPU AI inference servers running large language models (LLMs) like Qwen 72B at Q8_0 precision. The blower cooler design allows cards to be stacked in 1-3-5-7 slot configurations inside 4U chassis without thermal throttling.
          - heading "Why It Matters" [level=4] [ref=e57]
          - paragraph [ref=e58]: At $950 for 32GB VRAM, the B70 offers the lowest cost-per-GB of any professional AI GPU. Native XMX acceleration means Q8_0 quantized models run at full speed without accuracy loss, making it ideal for medical AI applications where precision matters.
