<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwen 3.5 Dev & LIVE Production Planner</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;600;700;900&display=swap"
    rel="stylesheet">

  <!-- Error Handling -->
  <script>
    window.onerror = function (msg, url, line, col, error) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:white;padding:20px;z-index:9999;font-family:sans-serif;white-space:pre-wrap;';
      d.innerHTML = 'Script Error: ' + msg + '<br>Line: ' + line + '<br>' + (error && error.stack ? error.stack : '');
      document.body.appendChild(d);
      return false;
    };
  </script>

  <!-- React & ReactDOM (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Recharts (UMD) & PropTypes -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.10.3/umd/Recharts.min.js"></script>

      --blue-100: #dbeafe;
      --blue-200: #bfdbfe;
      --blue-400: #60a5fa;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --blue-700: #1d4ed8;
      --blue-900: #1e3a8a;

      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-700: #334155;
      --slate-900: #0f172a;
      --red-100: #fee2e2;

      margin: 0 auto;
    }

    }

    .flex-col {

    .items-center {

    }

    .gap-2 {

    }

    .gap-3 {
      gap: 0.75rem;
    }

    .gap-4 {
      gap: 1rem;
    }

    .gap-6 {
      gap: 1.5rem;
    }

    .gap-8 {
      gap: 2rem;
    }

    .text-center {
      text-align: center;
    }

    .mb-1 {
      margin-bottom: 0.25rem;
    }

    .mb-2 {
      margin-bottom: 0.5rem;
    }

    .mb-5 {
      margin-bottom: 1.25rem;
    }

    .mb-6 {
      margin-bottom: 1.5rem;
    }

    .mb-8 {

    .mt-1 {

    .mt-8 {

    .pt-4 {

    }

    .pt-6 {

    }

      padding-bottom: 2rem;
    }

    .w-full {
      width: 100%;
    }

    .text-blue-500 {
      color: var(--blue-500);
    }

    .text-blue-600 {
      color: var(--blue-600);
    }

    .text-blue-900 {
      color: var(--blue-900);
    }

    .text-red-500 {
      color: var(--red-500);
    }

    .text-green-500 {

    /* Component styles */

      padding: 2rem;

    .logo-box {

    .info-card {

    .hw-card-fit {

<body>
  <div id="root"></div>

  <!-- Babel Standalone (to compile JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine, Cell } = window.Recharts || {};

    // Custom Icon Components to replace Lucide
    const Globe = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10" /><line x1="2" y1="12" x2="22" y2="12" /><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /></svg>;
    const FlaskConical = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 2v7.31" /><path d="M14 9.3V1.99" /><path d="M8.5 2h7" /><path d="M14 9.3a6.5 6.5 0 1 1-4 0" /><path d="M5.5 16.5h13" /></svg>;
    const ShieldCheck = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" /><path d="m9 12 2 2 4-4" /></svg>;
    const Info = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg>;
    const Activity = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 12h-4l-3 9L9 3l-3 9H2" /></svg>;
    const TrendingUp = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></svg>;
    const CheckCircle2 = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></svg>;
    const AlertTriangle = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg>;

    const App = () => {
      const [concurrency, setConcurrency] = useState(5);
      const [selectedModel, setSelectedModel] = useState('35B');

      // March 2026 Tech Specs - Validated Blackwell Data
      // 110B uses Q4_K_M quantization to fit in single GPU
      const models = {
        '35B': {
          params: 35,
          quant: 4.5,
          baseVram: 20,
          kvCachePerUser: 0.12,
        },
        '110B': {
          params: 110,
          quant: 4.5,
          baseVram: 48,  // Q4 quantization reduces from 220GB to ~48GB
          kvCachePerUser: 0.25,
        }
      };

      const hardware = [
        {
          name: 'RTX 6000 Pro',
          vram: 96,
          bandwidth: 1792, // Blackwell 512-bit GDDR7
          type: 'VRAM',
          computeTFLOPS: 240, // FP8 Peak
          description: 'Blackwell Enterprise King'
        },
        {
          name: 'RTX 5090',
          vram: 32,
          bandwidth: 1800,
          type: 'VRAM',
          computeTFLOPS: 200,
          description: 'Consumer Speed Demon'
        },
        {
          name: 'Mac Studio (M4 Ultra)',
          vram: 128,
          bandwidth: 800,
          type: 'Unified',
          computeTFLOPS: 80,
          description: 'Shared Memory Specialist'
        },
        {
          name: 'Strix Halo Laptop',
          vram: 128,
          bandwidth: 500,
          type: 'Unified',
          computeTFLOPS: 45,
          description: 'High-End Portable'
        }
      ];

      const auditData = useMemo(() => {
        const model = models[selectedModel];
        return hardware.map(hw => {
          const totalVramRequired = model.baseVram + (model.kvCachePerUser * concurrency);
          const fits = hw.vram >= totalVramRequired;

          const weightsSize = model.params * 0.6; // GB
          const singleUserThroughput = hw.bandwidth / weightsSize;
          const systemThroughputLimit = (hw.computeTFLOPS * 1000) / (model.params * 1.5);

          let userTokensPerSec = 0;
          if (fits) {
            const totalThroughput = Math.min(
              singleUserThroughput * concurrency * 0.85,
              systemThroughputLimit * 0.9
            );

            const queuePenalty = Math.max(1, concurrency / 80);
            userTokensPerSec = (totalThroughput / concurrency) / queuePenalty;
            userTokensPerSec = Math.min(userTokensPerSec, singleUserThroughput);
          }

          const status = !fits ? 'VRAM Failure' : (userTokensPerSec < 10 ? 'Token Starvation' : 'Optimal');

          return {
            ...hw,
            totalVramRequired: totalVramRequired.toFixed(1),
            userTokensPerSec: parseFloat(userTokensPerSec.toFixed(1)),
            displayTokens: fits ? parseFloat(userTokensPerSec.toFixed(1)) : 0,
            utilization: ((totalVramRequired / hw.vram) * 100).toFixed(1),
            fits,
            status
          };
        });
      }, [concurrency, selectedModel]);

      return (
        <div className="container">
          {/* VIDISMART Header */}
          <div className="header-card">
            <div className="flex items-center gap-4">
              <div className="logo-box">
                <Globe size={32} />
              </div>
              <div>
                <h1 className="title">
                  VIDISMART <span className="text-blue-500">AI</span>
                </h1>
                <p className="subtitle">
                  Qwen 3.5 Dev & LIVE Production
                </p>
              </div>
            </div>

            <div className="toggle-container">
              <button
                onClick={() => setSelectedModel('35B')}
                className={`toggle-button ${selectedModel === '35B' ? 'toggle-active-white' : 'toggle-inactive'}`}
              >
                35B Dev
              </button>
              <button
                onClick={() => setSelectedModel('110B')}
                className={`toggle-button ${selectedModel === '110B' ? 'toggle-active' : 'toggle-inactive'}`}
              >
                110B Live
              </button>
            </div>
          </div>

          <div className="grid-layout">
            {/* DEV CONTROLS */}
            <div className="sidebar">
              <div className="card">
                <h3 className="card-header">
                  <FlaskConical size={20} className="text-blue-500" />
                  Infrastructure Planner
                </h3>

                <div className="concurrency-grid">
                  {[5, 64, 128, 250].map(n => (
                    <button
                      key={n}
                      onClick={() => setConcurrency(n)}
                      className={`concurrency-btn ${concurrency === n ? 'concurrency-btn-active' : ''}`}
                    >
                      {n === 250 ? 'Stress (250)' : `${n} Users`}
                    </button>
                  ))}
                </div>

                <div className="target-box">
                  <p className="target-label">Target Concurrency</p>
                  <p className="target-val">{concurrency}</p>
                </div>

                <div className="mb-8 p-1">
                  <input
                    type="range"
                    min="1"
                    max="250"
                    value={concurrency}
                    onChange={(e) => setConcurrency(parseInt(e.target.value))}
                  />
                </div>

                <div className="pt-6">
                  <div className="stat-row">
                    <span className="stat-label">Base Weights</span>
                    <span className="stat-val-default">{models[selectedModel].baseVram} GB</span>
                  </div>
                  <div className="stat-row">
                    <span className="stat-label">Dynamic KV Cache</span>
                    <span className="stat-val-highlight">{(models[selectedModel].kvCachePerUser * concurrency).toFixed(1)} GB</span>
                  </div>
                  <div className="total-row">
                    <span>Total VRAM</span>
                    <span>{(models[selectedModel].baseVram + (models[selectedModel].kvCachePerUser * concurrency)).toFixed(1)} <span style={{ fontSize: "0.875rem" }}>GB</span></span>
                  </div>
                </div>
              </div>

              <div className="info-card">
                <div className="info-card-bg-icon">
                  <ShieldCheck size={140} />
                </div>
                <h3 className="info-title">
                  <Info size={18} /> Smart Deployment
                </h3>
                <p className="info-text">
                  VIDISMART Production logic accounts for <b>Context Congestion</b>. At extreme scale (250+), hardware must shift from single-instance speeds to <b>multi-node orchestrated batching</b> for stable throughput.
                </p>
              </div>
            </div>

            {/* LIVE ANALYTICS */}
            <div className="main-content">
              <div className="chart-card">
                <div className="chart-bg-icon">
                  <Activity size={100} />
                </div>
                <h3 className="chart-title">
                  <TrendingUp size={22} className="text-blue-600" />
                  Live Production Throughput (Tokens/s)
                </h3>
                <div className="chart-container">
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={auditData} layout="vertical" margin={{ left: 50, right: 50 }}>
                      <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} stroke="#f1f5f9" />
                      <XAxis type="number" stroke="#94a3b8" tick={{ fontSize: 10, fontWeight: 700 }} />
                      <YAxis dataKey="name" type="category" width={110} tick={{ fill: '#1e3a8a', fontSize: 11, fontWeight: 900 }} />
                      <Tooltip
                        contentStyle={{ backgroundColor: '#fff', border: 'none', borderRadius: '16px', boxShadow: '0 10px 25px -5px rgba(0,0,0,0.1)' }}
                        itemStyle={{ color: '#2563eb', fontWeight: 900 }}
                        cursor={{ fill: 'rgba(37, 99, 235, 0.03)' }}
                        formatter={(value, name, props) => [props.payload.userTokensPerSec + ' t/s', 'Throughput']}
                      />
                      <Bar dataKey="displayTokens" radius={[0, 8, 8, 0]}>
                        {auditData.map((entry, index) => (
                          <Cell key={`cell-${index}`} fill={entry.status === 'Optimal' ? '#2563eb' : (entry.status === 'Token Starvation' ? '#94a3b8' : '#ef4444')} />
                        ))}
                      </Bar>
                      <ReferenceLine x={10} stroke="#ef4444" strokeDasharray="5 5" label={{ value: 'Usability Floor', position: 'top', fill: '#ef4444', fontSize: 10, fontWeight: 900 }} />
                    </BarChart>
                  </ResponsiveContainer>
                </div>
              </div>

              <div className="hw-grid">
                {auditData.map((hw, idx) => (
                  <div key={idx} className={`hw-card ${hw.fits ? 'hw-card-fit' : 'hw-card-nofit'}`}>
                    <div className="flex justify-between items-center mb-1">
                      <h4 className="hw-title">{hw.name}</h4>
                      {hw.status === 'Optimal' ? <CheckCircle2 className="text-green-500" size={24} /> : <AlertTriangle className="text-red-500" size={24} />}
                    </div>
                    <div className="hw-desc">{hw.description}</div>

                    <div className="mb-2">
                      <div className="vram-label">
                        <span>VRAM Allocation</span>
                        <span className={parseFloat(hw.utilization) > 90 ? 'text-red-500 font-bold' : 'text-blue-600 font-bold'}>{hw.utilization}%</span>
                      </div>
                      <div className="progress-bar-bg">
                        <div
                          className={`progress-bar-fill ${parseFloat(hw.utilization) > 100 ? 'progress-red' : 'progress-blue'}`}
                          style={{ width: `${Math.min(100, parseFloat(hw.utilization))}%` }}
                        />
                      </div>
                    </div>

                    <div className="live-exp-box">
                      <div>
                        <p className="live-exp-label">Live Experience</p>
                        <p className="live-exp-val">
                          {hw.userTokensPerSec} <span className="live-exp-unit">t/s</span>
                        </p>
                      </div>
                      <div className={`status-badge ${hw.status === 'Optimal' ? 'status-optimal' : (hw.status === 'VRAM Failure' ? 'status-error' : 'status-neutral')}`}>
                        {hw.status}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* VIDISMART Footer */}
          <div className="footer">
            <div className="flex items-center gap-2">
              <ShieldCheck size={14} className="text-blue-500" />
              <span>Encrypted Live Stream Production Environment</span>
            </div>
            <div>© 2026 VIDISMART GLOBAL AI INFRASTRUCTURE</div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
