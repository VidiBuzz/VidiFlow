<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Community - Resources</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>AI Community Resources</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="directory.html">Directory</a></li>
                    <li><a href="resources.html">Resources</a></li>
                    <li><a href="community.html">Community</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="resources-header">
            <div class="container">
                <h2>AI Resources & Articles</h2>
                <p>Stay updated with the latest AI news, tutorials, and insights.</p>
            </div>
        </section>

        <section class="resources-list">
            <div class="container">
                <div class="filters">
                    <select id="resourceTypeFilter">
                        <option value="all">All Types</option>
                        <option value="article">Articles</option>
                        <option value="tutorial">Tutorials</option>
                        <option value="research">Research Papers</option>
                        <option value="news">News</option>
                    </select>
                    <input type="text" id="resourceSearch" placeholder="Search resources...">
                </div>
                <div class="grid" id="resourcesGrid">
                    <!-- Resources will be populated here by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 AI Community. All rights reserved.</p>
        </div>
    </footer>

    <script src="assets/js/directus-service.js"></script>
    <script src="assets/js/resources.js"></script>
</body>
</html>
