<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Community - Directory</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>AI Community Directory</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="directory.html">Directory</a></li>
                    <li><a href="resources.html">Resources</a></li>
                    <li><a href="community.html">Community</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="search-filter">
            <div class="container">
                <h2>Search AI Companies & Consultants</h2>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search by name, location, specialty...">
                    <button id="searchBtn">Search</button>
                </div>
                <div class="filters">
                    <select id="typeFilter">
                        <option value="all">All Types</option>
                        <option value="company">AI Companies</option>
                        <option value="consultant">AI Consultants</option>
                    </select>
                    <select id="locationFilter">
                        <option value="all">All Locations</option>
                        <option value="south-florida">South Florida</option>
                        <option value="miami">Miami</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="directory-list">
            <div class="container">
                <div id="resultsCount"></div>
                <div class="grid" id="directoryGrid">
                    <!-- Directory items will be populated here by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 AI Community. All rights reserved.</p>
        </div>
    </footer>

    <script src="assets/js/directus-service.js"></script>
    <script src="assets/js/directory.js"></script>
</body>
</html>
