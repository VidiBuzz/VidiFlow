<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidiSmart Ai Site Planner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased">
    <div style="display: flex; justify-content: center; align-items: center; margin-top: 0; margin-bottom: -22px;">
      <canvas id="vidismart-logo" width="240" height="240" style="display: block; background: transparent;"></canvas>
    </div>
    <canvas id="cloud-canvas" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-2;pointer-events:none;"></canvas>
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold mb-2 title-shadow">
                <span class="headline-gradient">VidiSmart</span> Ai Site Planner
            </h1>
            <p class="text-lg text-gray-400">Configure your modern, Ai SmartChannel Tech Stack.</p>
            <div class="flex justify-center items-center space-x-4 md:space-x-8 mt-4">
                <span class="brand-item">VidiCRM™</span>
                <div class="separator" style="--delay: 0s;"></div>
                <span class="brand-item">VidiBlast & VidiMail™</span>
                <div class="separator" style="--delay: 0.5s;"></div>
                <span class="brand-item">VidiBot™</span>
            </div>
        </header>

        <!-- Configuration Form -->
        <div class="vidismart-bg-dark p-6 md:p-8 rounded-xl">
            <div class="vidismart-center-stripe"></div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-x-8 gap-y-8">
                <!-- Column 1: Data Infrastructure -->
                <div class="space-y-8">
                    <div class="column-header">
                        <div class="header-logo" style="--delay: 0s;"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12h16M4 8h16M4 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                        <h3 class="column-header-text">Data Infrastructure</h3>
                    </div>
                    <div><label for="backend" class="block mb-2 font-semibold text-gray-300 text-lg">Backend & Database</label><select id="backend" class="w-full"></select></div>
                    <div><label for="cms" class="block mb-2 font-semibold text-gray-300 text-lg">Content Management (CMS)</label><select id="cms" class="w-full"></select></div>
                    <div><label for="frontend" class="block mb-2 font-semibold text-gray-300 text-lg">Frontend Framework</label><select id="frontend" class="w-full"></select></div>
                </div>

                <!-- Column 2: Ai Transactions & LLM -->
                <div class="space-y-8">
                    <div class="column-header">
                        <div class="header-logo" style="--delay: 0.2s;"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L9 9l-7 2.5 7 2.5 3 7 3-7 7-2.5-7-2.5L12 2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M19 12l-2 3-3-2 2-3 3 2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></div>
                        <h3 class="column-header-text">Ai Transactions & LLM</h3>
                    </div>
                    <div><label for="vectorDB" class="block mb-2 font-semibold text-gray-300 text-lg">Vector Database</label><select id="vectorDB" class="w-full"></select></div>
                    <div><label for="agentTools" class="block mb-2 font-semibold text-gray-300 text-lg">Agentified Agent Army</label><select id="agentTools" class="w-full"></select></div>
                    <div><label for="crm" class="block mb-2 font-semibold text-gray-300 text-lg">CRM & Marketing</label><select id="crm" class="w-full"></select></div>
                </div>

                <!-- Column 3: Ai Video UI Design -->
                <div class="space-y-8">
                     <div class="column-header">
                        <div class="header-logo" style="--delay: 0.4s;"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                        <h3 class="column-header-text">Ai Video UI Design</h3>
                    </div>
                    <div><label for="archetype" class="block mb-2 font-semibold text-gray-300 text-lg">Project Archetype</label><select id="archetype" class="w-full"></select></div>
                    <div><label for="ai-video" class="block mb-2 font-semibold text-gray-300 text-lg">AI Video Creation Tool</label><select id="ai-video" class="w-full"></select></div>
                    <div><label for="siteCreation" class="block mb-2 font-semibold text-gray-300 text-lg">Ai Site Creation</label><select id="siteCreation" class="w-full"></select></div>
                </div>
            </div>
            <!-- Modern Panel for Bottom 6 Buttons -->
            <div class="bottom-panel">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-x-8 gap-y-8">
                     <div>
                        <label for="hosting-btn" class="block mb-2 font-semibold text-gray-300 text-lg">Hosting & Deployment</label>
                        <button id="hosting-btn" data-category="hosting" class="modal-btn glass-btn"></button>
                    </div>
                    <div>
                        <label for="ai-model-btn" class="block mb-2 font-semibold text-gray-300 text-lg">Primary AI Models</label>
                        <button id="ai-model-btn" data-category="ai-model" class="modal-btn glass-btn"></button>
                    </div>
                    <div>
                        <label for="uiuxTools-btn" class="block mb-2 font-semibold text-gray-300 text-lg">UI/UX Design Tools</label>
                        <button id="uiuxTools-btn" data-category="uiuxTools" class="modal-btn glass-btn"></button>
                    </div>
                    <div>
                        <label for="videoHosting-btn" class="block mb-2 font-semibold text-gray-300 text-lg">Video Hosting Channel</label>
                        <button id="videoHosting-btn" data-category="videoHosting" class="modal-btn glass-btn"></button>
                    </div>
                    <div>
                        <label for="payment-btn" class="block mb-2 font-semibold text-gray-300 text-lg">Payment Gateways</label>
                        <button id="payment-btn" data-category="payment" class="modal-btn glass-btn"></button>
                    </div>
                    <div>
                        <label for="mcpServers-btn" class="block mb-2 font-semibold text-gray-300 text-lg">MCP Servers</label>
                        <button id="mcpServers-btn" data-category="mcpServers" class="modal-btn glass-btn"></button>
                    </div>
                </div>
            </div>
            <!-- Generate Button -->
            <div class="mt-10 pt-8 border-t border-gray-700 text-center">
                <button id="generate-plan" class="btn btn-sweep font-bold text-lg bg-yellow-500 text-gray-900 hover:bg-yellow-400 w-full md:w-auto px-10 py-3">
                    Generate My Solution
                </button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results-container" class="mt-12"></div>
        
        <!-- AI Analysis Section -->
        <div id="ai-analysis-button-container" class="mt-8 text-center" style="display: none;">
             <button id="get-ai-analysis" class="btn btn-sweep font-bold text-lg bg-blue-600 text-white hover:bg-blue-500 w-full md:w-auto px-10 py-3">
                ✨ Get AI Analysis
            </button>
        </div>
        <div id="ai-analysis-container" class="mt-8"></div>
    </div>

    <!-- Modal Structure -->
    <div id="multi-select-modal" class="modal-overlay" style="display: none;">
        <div class="modal-panel">
            <div class="modal-header-relative">
                <h3 id="modal-title" class="text-2xl font-bold text-white">Select Options</h3>
                <button id="modal-close-btn" class="text-gray-400 hover:text-white text-3xl font-bold">×</button>
            </div>
            <div class="mb-4">
                 <button id="modal-clear-btn" class="w-full text-sm text-center text-gray-400 hover:text-white underline">Clear Selection</button>
            </div>
            <div id="modal-content" class="modal-content mb-6">
                <!-- Checkboxes will be injected here -->
            </div>
            <div class="mt-auto text-right">
                <button id="modal-save-btn" class="btn bg-yellow-500 text-gray-900 hover:bg-yellow-400 px-6">Done</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
