<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pre-Vis Hand Controller</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            pointer-events: none;
        }

        #debug-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
            min-width: 150px;
        }

        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 18px;
            background: #222;
            color: white;
            border: 2px solid #00ffcc;
            cursor: pointer;
            z-index: 101;
            transition: all 0.3s;
        }

        #start-btn:hover { background: #00ffcc; color: black; }
        video { display: none; } /* Hidden webcam stream */
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>Hand Pre-Vis Blocking</h1>
        <p>Pinch to Grab | Thumb-Pinky to Scale | Tilt to Rotate</p>
    </div>

    <div id="debug-panel">
        <div>STATUS: <span id="status">Waiting...</span></div>
        <div>GESTURE: <span id="gesture">Idle</span></div>
        <div>GRAB: <span id="is-grabbing">No</span></div>
    </div>

    <button id="start-btn">START CAMERA</button>
    <video id="webcam" autoplay playsinline></video>

    <!-- Load Three.js and MediaPipe via CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { Reflector } from 'three/addons/objects/Reflector.js';
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

        let handLandmarker;
        let webcamRunning = false;
        const video = document.getElementById("webcam");
        const startBtn = document.getElementById("start-btn");
        
        // Scene Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x050505, 10, 50);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00ffcc, 100, 50);
        pointLight.castShadow = true;
        scene.add(pointLight);

        // Reflective Floor
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        const groundMirror = new Reflector(floorGeometry, {
            clipBias: 0.003,
            textureWidth: window.innerWidth * window.devicePixelRatio,
            textureHeight: window.innerHeight * window.devicePixelRatio,
            color: 0x111111
        });
        groundMirror.rotateX(-Math.PI / 2);
        scene.add(groundMirror);

        // Hero Object (Torus Knot)
        const geometry = new THREE.TorusKnotGeometry(1, 0.3, 100, 16);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00ffcc, 
            emissive: 0x003322,
            metalness: 0.8, 
            roughness: 0.2 
        });
        const heroObject = new THREE.Mesh(geometry, material);
        heroObject.position.y = 2;
        heroObject.castShadow = true;
        scene.add(heroObject);

        // UI Updates
        const updateDebug = (gesture, grabbing) => {
            document.getElementById('gesture').innerText = gesture;
            document.getElementById('is-grabbing').innerText = grabbing ? "YES" : "NO";
            document.getElementById('status').innerText = "TRACKING";
        };

        // Initialize MediaPipe
        async function initMediaPipe() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });
        }

        // Start Camera
        startBtn.addEventListener("click", async () => {
            startBtn.style.display = "none";
            await initMediaPipe();
            const constraints = { video: true };
            navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
            });
        });

        // Mapping Coordinates Logic
        function mapToScene(x, y) {
            // Converts normalized (0,1) to Three.js (-10 to 10 approx)
            const sceneX = (x - 0.5) * -15; // Inverted for mirror effect
            const sceneY = (0.5 - y) * 10 + 2; 
            return { x: sceneX, y: sceneY };
        }

        let lastVideoTime = -1;
        function predictWebcam() {
            let nowInMs = Date.now();
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                const results = handLandmarker.detectForVideo(video, nowInMs);

                if (results.landmarks && results.landmarks.length > 0) {
                    const landmarks = results.landmarks[0];
                    
                    // 1. Centroid (using wrist and middle base)
                    const wrist = landmarks[0];
                    const middleBase = landmarks[9];
                    const cx = (wrist.x + middleBase.x) / 2;
                    const cy = (wrist.y + middleBase.y) / 2;
                    const pos = mapToScene(cx, cy);

                    // 2. Pinch Check (Index tip 8 vs Thumb tip 4)
                    const distPinch = Math.hypot(landmarks[8].x - landmarks[4].x, landmarks[8].y - landmarks[4].y);
                    const isGrabbing = distPinch < 0.05;

                    // 3. Scaling (Thumb 4 vs Pinky 20)
                    const distScale = Math.hypot(landmarks[20].x - landmarks[4].x, landmarks[20].y - landmarks[4].y);
                    const scaleFactor = Math.max(0.5, distScale * 5);

                    // 4. Rotation (Tilt between wrist 0 and index base 5)
                    const angle = Math.atan2(landmarks[5].y - landmarks[0].y, landmarks[5].x - landmarks[0].x);

                    // Apply to 3D Scene
                    if (isGrabbing) {
                        heroObject.position.lerp(new THREE.Vector3(pos.x, pos.y, 0), 0.2);
                        heroObject.material.emissive.setHex(0x00ffcc);
                        heroObject.material.emissiveIntensity = 0.5;
                        updateDebug("GRABBING", true);
                    } else {
                        heroObject.material.emissive.setHex(0x003322);
                        updateDebug("IDLE", false);
                    }

                    heroObject.scale.setScalar(scaleFactor);
                    heroObject.rotation.z = angle + Math.PI/2;
                    
                    // Point light follows hand
                    pointLight.position.set(pos.x, pos.y, 2);
                }
            }
            window.requestAnimationFrame(predictWebcam);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            heroObject.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
