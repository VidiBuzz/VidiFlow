<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>High-Fidelity AI Pre-Vis</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui-overlay {
            position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.8); 
            z-index: 100; pointer-events: none; user-select: none;
            text-shadow: 0 0 20px rgba(0,255,255,0.4);
        }
        h1 { margin: 0; font-weight: 300; letter-spacing: 2px; font-size: 18px; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 10px; display: inline-block;}
        p { font-size: 12px; color: #888; margin-top: 5px; }
        
        #start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 40px; font-size: 16px; background: rgba(0,0,0,0.8); color: #fff;
            border: 1px solid #fff; cursor: pointer; z-index: 101; letter-spacing: 3px;
            transition: 0.3s;
        }
        #start-btn:hover { background: #fff; color: #000; box-shadow: 0 0 40px #fff; }
        video { display: none; }
        .loading { color: #00ffcc; position: absolute; bottom: 20px; left: 20px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>Cinematic Pre-Vis // RTX ON</h1>
        <p>PINCH: GRAB | SPREAD: SCALE | TILT: ROTATE</p>
        <div id="status" class="loading">SYSTEM STANDBY</div>
    </div>

    <button id="start-btn">INITIALIZE ENGINE</button>
    <video id="webcam" autoplay playsinline></video>

    <!-- Import Map for Three.js, Post Processing, and GUI -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";
        import GUI from 'lil-gui';

        // --- 1. PROCEDURAL TEXTURE GENERATION (The "Texture" Fix) ---
        // Generates a normal/roughness map on the fly so we don't need external images
        function createNoiseTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#808080';
            ctx.fillRect(0,0,512,512);
            for(let i=0; i<80000; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const g = Math.floor(Math.random() * 50 + 100);
                ctx.fillStyle = `rgb(${g},${g},${g})`;
                ctx.fillRect(x,y,2,2);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        const noiseTexture = createNoiseTexture();

        // --- 2. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020202);
        // Add some fog for depth
        scene.fog = new THREE.FogExp2(0x020202, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- 3. POST PROCESSING (The "Fancy" Fix) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0;
        bloomPass.strength = 1.2; // How much glow
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- 4. LIGHTING RIG ---
        // A. Ambient
        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);

        // B. Main Key Light (Spotlight)
        const spotLight = new THREE.SpotLight(0xffffff, 500);
        spotLight.position.set(5, 10, 5);
        spotLight.angle = Math.PI / 4;
        spotLight.penumbra = 0.5;
        spotLight.castShadow = true;
        spotLight.shadow.mapSize.width = 2048;
        spotLight.shadow.mapSize.height = 2048;
        scene.add(spotLight);

        // C. Rim Light (Backlight for outlines)
        const rimLight = new THREE.PointLight(0x0088ff, 200);
        rimLight.position.set(-5, 2, -5);
        scene.add(rimLight);

        // --- 5. THE HERO OBJECT (Physical Material) ---
        // Using MeshPhysicalMaterial for "Car Paint" / Metallic look
        const geometry = new THREE.TorusKnotGeometry(1.5, 0.5, 200, 32);
        const material = new THREE.MeshPhysicalMaterial({
            color: 0x111111,
            metalness: 0.9,
            roughness: 0.4,
            roughnessMap: noiseTexture, // Use our generated texture for surface detail
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            emissive: 0x000000,
            emissiveIntensity: 1
        });
        
        const heroObj = new THREE.Mesh(geometry, material);
        heroObj.castShadow = true;
        heroObj.receiveShadow = true;
        scene.add(heroObj);

        // Add a "Core" inside the object that glows
        const coreGeo = new THREE.SphereGeometry(0.8, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xff0044 });
        const coreObj = new THREE.Mesh(coreGeo, coreMat);
        heroObj.add(coreObj); // Parented to hero

        // --- 6. PARTICLES (Better looking sprites) ---
        const partCount = 1000;
        const partGeom = new THREE.BufferGeometry();
        const partPos = [];
        for(let i=0; i<partCount*3; i++) partPos.push((Math.random()-0.5)*15);
        partGeom.setAttribute('position', new THREE.Float32BufferAttribute(partPos, 3));
        
        // Create soft circle texture for particles
        const spriteCanvas = document.createElement('canvas');
        spriteCanvas.width = 32; spriteCanvas.height = 32;
        const sCtx = spriteCanvas.getContext('2d');
        const grd = sCtx.createRadialGradient(16,16,0,16,16,16);
        grd.addColorStop(0, 'rgba(255,255,255,1)');
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        sCtx.fillStyle = grd; sCtx.fillRect(0,0,32,32);
        const spriteTex = new THREE.CanvasTexture(spriteCanvas);

        const partMat = new THREE.PointsMaterial({
            size: 0.15, 
            map: spriteTex, 
            transparent: true, 
            opacity: 0.6, 
            color: 0x0088ff,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const particleSystem = new THREE.Points(partGeom, partMat);
        scene.add(particleSystem);

        // --- 7. GUI CONTROLS ---
        const gui = new GUI({ title: 'Lighting Control' });
        const lightFolder = gui.addFolder('Spotlight');
        lightFolder.add(spotLight, 'intensity', 0, 1000).name('Brightness');
        lightFolder.addColor({ color: 0xffffff }, 'color').onChange(c => spotLight.color.set(c)).name('Color');
        
        const bloomFolder = gui.addFolder('Bloom / Post-FX');
        bloomFolder.add(bloomPass, 'strength', 0, 3).name('Glow Strength');
        bloomFolder.add(bloomPass, 'radius', 0, 1).name('Glow Radius');
        
        const matFolder = gui.addFolder('Hero Material');
        matFolder.add(material, 'roughness', 0, 1).name('Surface Roughness');
        matFolder.add(material, 'metalness', 0, 1).name('Metalness');
        matFolder.addColor({ color: 0xff0044 }, 'color').onChange(c => coreMat.color.set(c)).name('Core Color');

        // --- 8. MEDIAPIPE LOGIC ---
        let handLandmarker;
        const startBtn = document.getElementById("start-btn");
        const video = document.getElementById("webcam");

        async function initAI() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm");
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`, delegate: "GPU" },
                runningMode: "VIDEO", numHands: 1
            });
        }

        startBtn.addEventListener("click", async () => {
            startBtn.textContent = "LOADING AI MODEL...";
            await initAI();
            navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", predict);
                startBtn.style.display = 'none';
                document.getElementById('status').textContent = "TRACKING ACTIVE";
                document.getElementById('status').style.color = "#00ff00";
            });
        });

        let targetPos = new THREE.Vector3(0,0,0);
        let targetRot = 0;
        let targetScale = 1;

        function predict() {
            let lastTime = -1;
            const loop = () => {
                if (video.currentTime !== lastTime) {
                    lastTime = video.currentTime;
                    const results = handLandmarker.detectForVideo(video, Date.now());
                    
                    if (results.landmarks && results.landmarks.length > 0) {
                        const lm = results.landmarks[0];
                        
                        // Smoothly lerp interaction
                        const x = (lm[9].x - 0.5) * -12;
                        const y = (0.5 - lm[9].y) * 8;
                        targetPos.set(x, y, 0);

                        // Pinch (Grab)
                        const pinchDist = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
                        if (pinchDist < 0.05) {
                            material.emissive.setHex(0xff0044); // Glows red when grabbed
                            material.emissiveIntensity = 2.0;
                        } else {
                            material.emissive.setHex(0x000000);
                        }

                        // Rotate
                        targetRot = (lm[0].x - lm[5].x) * 5; 
                        
                        // Scale
                        const scaleDist = Math.hypot(lm[4].x - lm[20].x, lm[4].y - lm[20].y);
                        targetScale = Math.max(0.5, scaleDist * 5);
                    }
                }
                requestAnimationFrame(loop);
            }
            loop();
        }

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Smooth movement physics (Damping)
            heroObj.position.lerp(targetPos, 0.1);
            heroObj.rotation.x += 0.01;
            heroObj.rotation.y += 0.005;
            heroObj.rotation.z = THREE.MathUtils.lerp(heroObj.rotation.z, targetRot, 0.1);
            heroObj.scale.setScalar(THREE.MathUtils.lerp(heroObj.scale.x, targetScale, 0.1));

            particleSystem.rotation.y -= 0.002;

            composer.render();
        }
        
        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
