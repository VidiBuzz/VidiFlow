                const url = hasMappedUrl || `https://www.google.com/search?q=${encodeURIComponent(item)}`;
                let faviconDomain;
                if (hasMappedUrl) {
                    try {
                        faviconDomain = new URL(url).hostname;
                    } catch {
                        faviconDomain = item.toLowerCase().replace(/[^a-z0-9]/g, '') + ".com";
                    }
                } else {
                    const cleanName = item.toLowerCase().replace(/[^a-z0-9]/g, '');
                    const domainHints = {
                        'adobe': 'adobe.com', 'apple': 'apple.com', 'google': 'google.com',
                        'microsoft': 'microsoft.com', 'amazon': 'amazon.com', 'meta': 'meta.com',
                        'nvidia': 'nvidia.com', 'github': 'github.com', 'apache': 'apache.org',
                        'aws': 'aws.amazon.com', 'azure': 'azure.microsoft.com',
                        'cloudflare': 'cloudflare.com', 'vercel': 'vercel.com'
                    };
                    let found = false;
                    for (const [key, domain] of Object.entries(domainHints)) {
                        if (cleanName.includes(key)) { faviconDomain = domain; found = true; break; }
                    }
                    if (!found) {
                        const baseName = item.toLowerCase().split(/[\s(]/)[0].replace(/[^a-z0-9]/g, '');

                "vector": "Vector search engines, embeddings & retrieval-augmented generation.",
                "database": "SQL, NoSQL, time-series & real-time data infrastructure.",
                "streaming": "Event streaming, message brokers & real-time data pipelines.",
                "languages": "Core programming languages powering the 2026 stack.",
                "backend": "Server frameworks, API runtimes & full-stack platforms.",
                "frontend": "UI frameworks, design systems & frontend tooling.",
                "mobile": "Cross-platform, native & edge app development tools.",
                "edge": "Edge compute, hardware AI & WebAssembly runtimes.",
                "cloud": "Cloud platforms, serverless & managed infrastructure.",
                "devops": "Infrastructure as Code, containers & orchestration.",
                "cicd": "CI/CD pipelines, automation & release management.",
                "observability": "Monitoring, tracing, logging & alerting platforms.",
                "security": "Identity, secrets, vulnerability scanning & zero-trust.",
                "api": "API design, gateways, testing & developer experience.",
                "data-eng": "Data pipelines, orchestration & analytics engineering.",
                "testing": "E2E, unit, load testing & quality assurance platforms.",
                "business": "Collaboration, project management & productivity tools.",
                "knowledge-graphs": "Graph databases, Graph RAG frameworks, and knowledge extraction tools for structured reasoning.",
                "post-training": "Fine-tuning, RLHF, alignment, and evaluation frameworks for customizing foundation models.",
                "private-ai": "Hardware configurations, quantization specs, and local inference engines for on-premise AI deployment."
            };
            const subtitle = subtitles[section.id] || "Key infrastructure components for 2026 operations.";

            sectionDiv.innerHTML = `
                <div class="flex items-center gap-4 mb-8">
                    <div class="w-12 h-12 bg-white/5 border border-white/10 rounded-2xl flex items-center justify-center">
                        <i class="fas ${section.icon} text-sky-400 text-xl"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="text-2xl font-bold text-left">${section.title}</h3>
                        <p class="text-slate-500 text-sm text-left">${subtitle}</p>
                    </div>
                </div>
                ${top5Html}
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
                    ${itemsHtml}
                </div>
                ${extraGrid}
            `;
            sectionsContainer.appendChild(sectionDiv);
        });

        // Intersection Observer for Sidebar Highlighting
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    document.querySelectorAll('.sidebar-link').forEach(link => {
                        link.classList.toggle('active', link.getAttribute('href') === `#${entry.target.id}`);
                    });
                }
            });
        }, { threshold: 0.2 });

        document.querySelectorAll('section').forEach(section => observer.observe(section));

    </script>
</body>

</html>
