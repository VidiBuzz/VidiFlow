    <!-- Application Structure Plan: The application is structured as a single-page dashboard with a fixed sidebar for primary navigation and a main content area. This non-linear, thematic structure allows users (technologists, architects) to bypass irrelevant sections and jump directly to their areas of interest, such as comparing front-end frameworks or understanding CI/CD. The report's dense, chapter-based format is transformed into an active exploration tool. User flow is driven by clicking navigation links, which dynamically displays the relevant content section, making discovery efficient and user-driven. This is superior to a simple long-scroll page as it caters to specific user queries and facilitates easier comparison between disparate topics. -->
    <!-- Visualization & Content Choices: The report's comparative data is translated into interactive visualizations. For instance, 'Back-end Frameworks' are compared using a dynamic Chart.js radar chart and a filterable HTML table, allowing users to visually grasp high-level trade-offs and drill into details (Goal: Compare, Method: Chart.js/HTML, Interaction: Filtering/Highlighting). The 'UI/UX Process' is shown as an interactive HTML/CSS flowchart, where clicking a stage expands details, making a linear process digestible (Goal: Organize, Method: HTML/CSS, Interaction: Click-to-expand). The complex 'API Architecture' (REST vs. GraphQL) is visualized with animated HTML/CSS diagrams to clarify data flow concepts more effectively than text alone (Goal: Compare, Method: HTML/CSS/JS, Interaction: Toggle animation). These choices prioritize interactive learning over passive reading. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

            line-height: 1.75rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 0.75rem;

            color: #475569;
            margin-bottom: 0;
        }
        .card .sub-heading {
            font-weight: 500;
            color: #334155;
            margin-bottom: 0.5rem;
        }

            list-style-position: inside;
            padding-left: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;

            margin-right: auto;

        .ucd-arrow {

            justify-content: space-around;
            align-items: center;
            gap: 1rem;

        .diagram-step {

        @media (min-width: 768px) {
            .diagram-container {
                flex-direction: row;
                gap: 1rem;
            }
        }
    </style>
</head>

                        <h2>The AI Frontier: Vector Database Project Archetype</h2>
                        <p class="intro-paragraph">The next generation of AI applications relies on understanding unstructured data (text, images). This is powered by a new archetype combining AI models and Vector Databases. AI models create 'embeddings'—numerical representations of meaning—and Vector Databases are specially designed to store and search these embeddings at incredible speed, enabling features like semantic search and recommendation engines.</p>
                        <div class="card">
                             <h3 class="chart-title">Simplified RAG Flow (Retrieval-Augmented Generation)</h3>
                             <div class="diagram-container" style="flex-direction: column; gap: 0.5rem;">
                                <div class="rag-flow-step">
                                    <div class="diagram-icon-wrapper rag-icon-user"><span>User</span></div>
                                    <p>User asks a question: "What is a vector database?"</p>
                                </div>
                                <div class="rag-flow-arrow">&darr;</div>
                                 <div class="rag-flow-step">
                                    <div class="diagram-icon-wrapper rag-icon-ai"><span>AI</span></div>
                                    <p>An AI model converts the question into a vector embedding (a list of numbers representing its meaning).</p>
                                </div>
                                 <div class="rag-flow-arrow">&darr;</div>
                                <div class="rag-flow-step">
                                    <div class="diagram-icon-wrapper rag-icon-db"><span>DB</span></div>
                                    <p>The Vector Database searches billions of document vectors to find those with the most similar meaning to the question vector.</p>
                                </div>
                                 <div class="rag-flow-arrow">&darr;</div>
                                <div class="rag-flow-step">
                                    <div class="diagram-icon-wrapper rag-icon-llm"><span>LLM</span></div>
                                    <p>The relevant documents and the original question are sent to a Large Language Model (LLM).</p>
                                </div>
                                 <div class="rag-flow-arrow">&darr;</div>
                                <div class="rag-flow-step">
                                    <div class="diagram-icon-wrapper rag-icon-ans"><span>Ans</span></div>
                                    <p>The LLM generates a factual, context-aware answer based on the provided documents.</p>
                                </div>
                             </div>
                        </div>
                    `
                },
            ]
        };

        const chartColors = {
            teal: 'rgba(13, 148, 136, 0.6)',
            amber: 'rgba(217, 119, 6, 0.6)',
            sky: 'rgba(2, 132, 199, 0.6)',
            purple: 'rgba(147, 51, 234, 0.6)',
            emerald: 'rgba(5, 150, 105, 0.6)',
            border: {
                teal: 'rgb(13, 148, 136)',
                amber: 'rgb(217, 119, 6)',
                sky: 'rgb(2, 132, 199)',
                purple: 'rgb(147, 51, 234)',
                emerald: 'rgb(5, 150, 105)'
            }
        };

        const ucdData = [
            { 
                title: "1. Research & Specify Context", 
                content: "The process begins with research to understand users, their goals, and their environment. Key activities include stakeholder interviews, user surveys, and competitive analysis. The primary output is the creation of User Personas—fictional characters representing the target audience."
            },
            { 
                title: "2. Specify Requirements", 
                content: "Research insights are translated into a clear set of user needs and business requirements. This step defines what the product must do to be successful for both the user and the business, often resulting in user stories and feature lists."
            },
            { 
                title: "3. Create Design Solutions", 
                content: "This is the ideation phase where designers brainstorm and develop solutions. Artifacts like user flows, wireframes (structural blueprints), and mockups (visual designs) are created to visualize the product's structure and feel."
            },
            { 
                title: "4. Evaluate & Iterate", 
                content: "Designs are tested with real users. Prototypes (interactive models) are created and put through usability testing to identify flaws and validate assumptions. Feedback from this stage is crucial and feeds directly back into refining the design, continuing the cycle."
            }
        ];

        let activeChart = null;

        function initNav() {
            const navMenu = document.getElementById('nav-menu');
            const contentArea = document.getElementById('content-area');
            navMenu.innerHTML = '';
            contentArea.innerHTML = '';
            appData.sections.forEach(section => {
                const link = document.createElement('a');
                link.href = '#';
                link.id = `nav-${section.id}`;
                link.className = 'nav-link';
                link.textContent = section.title;
                link.onclick = (e) => {
                    e.preventDefault();
                    showSection(section.id);
                };
                navMenu.appendChild(link);

                const contentDiv = document.createElement('div');
                contentDiv.id = section.id;
                contentDiv.className = 'content-section';
                contentDiv.innerHTML = section.content;
                contentArea.appendChild(contentDiv);
            });
        }

        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });
            
            document.getElementById(sectionId).classList.add('active');
            document.getElementById(`nav-${sectionId}`).classList.add('active');

            if (activeChart) {
                activeChart.destroy();
                activeChart = null;
            }
            
            if (sectionId === 'backend-frameworks') initBackendFrameworksChart();
            if (sectionId === 'database-tech') initDatabaseTechChart();
            if (sectionId === 'frontend-frameworks') initFrontendFrameworksChart();
            if (sectionId === 'cloud-infra') initCloudProviderChart();
            if (sectionId === 'api-architecture') initApiViz();
            if (sectionId === 'ui-ux-process') initUcdFlow();
        }

        function initBackendFrameworksChart() {
            const ctx = document.getElementById('backendFrameworksChart').getContext('2d');
            const data = {
                labels: ['Productivity', 'Performance', 'Flexibility', 'Learning Curve', 'Ecosystem'],
                datasets: [
                    {
                        label: 'Node.js (Express)',
                        data: [7, 9, 9, 7, 10],
                        backgroundColor: chartColors.teal,
                        borderColor: chartColors.border.teal,
                        borderWidth: 2,
                        pointBackgroundColor: chartColors.border.teal
                    },
                    {
                        label: 'Python (Django)',
                        data: [9, 7, 6, 8, 9],
                        backgroundColor: chartColors.amber,
                        borderColor: chartColors.border.amber,
                        borderWidth: 2,
                        pointBackgroundColor: chartColors.border.amber
                    },
                    {
                        label: 'Java (Spring)',
                        data: [6, 9, 7, 4, 10],
                         backgroundColor: chartColors.sky,
                        borderColor: chartColors.border.sky,
                        borderWidth: 2,
                        pointBackgroundColor: chartColors.border.sky
                    },
                    {
                        label: 'Ruby (Rails)',
                        data: [10, 6, 5, 9, 8],
                        backgroundColor: chartColors.purple,
                        borderColor: chartColors.border.purple,
                        borderWidth: 2,
                        pointBackgroundColor: chartColors.border.purple
                    }
                ]
            };
            activeChart = new Chart(ctx, {
                type: 'radar',
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: { r: { suggestedMin: 0, suggestedMax: 10 } }
                }
            });
        }
        
        function initDatabaseTechChart() {
             const ctx = document.getElementById('databaseTechChart').getContext('2d');
             const data = {
                labels: ['Data Integrity', 'Complex Queries', 'Read Speed', 'Write Speed', 'Flexibility'],
                datasets: [{

                    data: [10, 9, 7, 9, 7],
                    backgroundColor: chartColors.sky,

                    borderWidth: 1
                }, {
                    label: 'MySQL',
                    data: [8, 7, 9, 7, 5],

                    label: 'MongoDB',
                    data: [6, 5, 8, 8, 10],

                    borderWidth: 1
                }]
             };
             activeChart = new Chart(ctx, {
                type: 'bar',
                data: data,
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, suggestedMax: 10 } }, plugins: { legend: { position: 'top' } } }
             });
        }

        function initFrontendFrameworksChart() {
             const ctx = document.getElementById('frontendFrameworksChart').getContext('2d');
             const data = {
                labels: ['Learning Curve', 'Performance', 'Flexibility', 'Ecosystem Size', 'Opinionated'],
                datasets: [{
                    label: 'React',
                    data: [8, 9, 10, 10, 3],
                    backgroundColor: chartColors.sky,

                }, {

                    borderWidth: 1
                }, {
                    label: 'Vue.js',
                    data: [9, 9, 8, 7, 5],
                    backgroundColor: chartColors.emerald,

                }]
             };
             activeChart = new Chart(ctx, {
                type: 'bar',
                data: data,
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, suggestedMax: 10 } }, plugins: { legend: { position: 'top' } } }
             });
        }
        
        function initCloudProviderChart() {
            const ctx = document.getElementById('cloudProviderChart').getContext('2d');
            const data = {
                labels: ['AWS', 'Azure', 'GCP', 'Other'],
                datasets: [{
                    label: 'Market Share %',
                    data: [31, 25, 11, 33],
                    backgroundColor: [chartColors.amber, chartColors.sky, chartColors.emerald, 'rgba(156, 163, 175, 0.6)'],
                    borderColor: [chartColors.border.amber, chartColors.border.sky, chartColors.border.emerald, 'rgb(156, 163, 175)'],
                    borderWidth: 1
                }]
            };
            activeChart = new Chart(ctx, {
                type: 'doughnut',
                data: data,
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } } }
            });
        }

        function initApiViz() {
            const restBtn = document.getElementById('showRest');
            const graphqlBtn = document.getElementById('showGraphql');
            const title = document.getElementById('api-viz-title');
            const content = document.getElementById('api-viz-content');

            const restHtml = `
                <div><div class="api-flow-box">Client</div></div>
                <div class="api-flow-arrows">
                    <div class="api-flow-arrow">&rarr; GET /users/123</div>
                    <div class="api-flow-arrow">&rarr; GET /users/123/posts</div>
                    <div class="api-flow-arrow">&rarr; GET /users/123/friends</div>
                </div>
                <div>
                    <div class="api-flow-box">Server</div>
                    <p class="api-flow-note">Multiple Endpoints</p>
                </div>
            `;

            const graphqlHtml = `
                <div><div class="api-flow-box">Client</div></div>
                <div>
                    <div class="api-flow-arrow">&rarr; POST /graphql</div>
                    <div class="graphql-query">query { user(id:123) { name, posts, friends } }</div>
                </div>
                <div>
                    <div class="api-flow-box">Server</div>
                    <p class="api-flow-note">Single Endpoint</p>
                </div>
            `;
            
            restBtn.onclick = () => {
                title.textContent = "REST: Multiple Requests for Multiple Resources";
                content.innerHTML = restHtml;
            };

            graphqlBtn.onclick = () => {
                title.textContent = "GraphQL: One Request for All Needed Data";
                content.innerHTML = graphqlHtml;
            };
        }

        function initUcdFlow() {
            const container = document.getElementById('ucd-flow');
            container.innerHTML = '';
            ucdData.forEach((item, index) => {
                const stepDiv = document.createElement('div');
                stepDiv.className = "flowchart-step interactive-card";
                stepDiv.innerHTML = `
                    <h4>${item.title}</h4>
                    <p class="hidden">${item.content}</p>
                `;
                stepDiv.onclick = () => {
                    const allSteps = container.querySelectorAll('.flowchart-step');
                    const wasActive = stepDiv.classList.contains('active');

                    allSteps.forEach(s => {
                        s.classList.remove('active');
                        s.querySelector('p').classList.add('hidden');
                    });
                    
                    if (!wasActive) {
                        stepDiv.classList.add('active');
                        stepDiv.querySelector('p').classList.remove('hidden');
                    }
                };
                container.appendChild(stepDiv);
                if(index < ucdData.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'ucd-arrow';
                    arrow.innerHTML = '&darr;';
                    container.appendChild(arrow);
                }
            });
        }
        
        window.onload = () => {
            initNav();
            showSection('foundation');
        };
    </script>
</body>
