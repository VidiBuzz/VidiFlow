<!DOCTYPE html>
<html>
<head>
  <title>VidiFlow - Thinking Indicator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0a0a1a; 
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    .thinking-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    
    .orb-container {
      position: relative;
      width: 150px;
      height: 150px;
    }
    
    .orb {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #00ccff 0%, #0066aa 50%, #003366 100%);
      animation: breathe 2s ease-in-out infinite;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 204, 255, 0.5);
    }
    
    .orb::before {
      content: '';
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      border: 2px solid rgba(0, 204, 255, 0.5);
      animation: ring-pulse 1.5s ease-in-out infinite;
    }
    
    .orb::after {
      content: '';
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      border: 1px solid rgba(0, 204, 255, 0.3);
      animation: ring-pulse 1.5s ease-in-out infinite 0.5s;
    }
    
    .ring-3 {
      position: absolute;
      inset: -45px;
      border-radius: 50%;
      border: 1px solid rgba(0, 204, 255, 0.2);
      animation: ring-pulse 1.5s ease-in-out infinite 1s;
    }
    
    @keyframes breathe {
      0%, 100% { 
        transform: scale(1); 
        opacity: 0.8;
        box-shadow: 0 0 30px rgba(0, 204, 255, 0.3);
      }
      50% { 
        transform: scale(1.1); 
        opacity: 1;
        box-shadow: 0 0 50px rgba(0, 204, 255, 0.6);
      }
    }
    
    @keyframes ring-pulse {
      0% { 
        transform: scale(0.8); 
        opacity: 0;
      }
      50% { 
        transform: scale(1.2); 
        opacity: 0.5;
      }
      100% { 
        transform: scale(0.8); 
        opacity: 0;
      }
    }
    
    .status-text {
      color: #00ccff;
      font-family: 'Courier New', monospace;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 4px;
      animation: text-pulse 1s ease-in-out infinite;
    }
    
    @keyframes text-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    
    .confidence-bar {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    
    .confidence-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ccff, #00ff88);
      width: 65%;
      animation: confidence-pulse 2s ease-in-out infinite;
    }
    
    @keyframes confidence-pulse {
      0%, 100% { width: 60%; }
      50% { width: 70%; }
    }
    
    .info {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(10, 10, 26, 0.9);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      z-index: 100;
      max-width: 300px;
    }
    
    .info h3 { 
      color: #00ccff; 
      margin-bottom: 10px; 
      font-size: 14px;
    }
    
    .info p {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
    }
    
    .states {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    
    .state-btn {
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(10, 10, 26, 0.8);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }
    
    .state-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.4);
    }
    
    .state-btn.active {
      border-color: #00ccff;
      background: rgba(0, 204, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="info">
    <h3>THINKING INDICATOR</h3>
    <p>OpenCode-style thinking animation adapted for web. Shows model confidence with visual cues:</p>
    <ul style="margin-top: 10px; font-size: 11px; color: #666;">
      <li>• Breathing orb with pulse effect</li>
      <li>• Concentric rings expanding outward</li>
      <li>• Confidence bar showing progress</li>
      <li>• Text animation for status</li>
    </ul>
  </div>
  
  <div class="thinking-container">
    <div class="orb-container">
      <div class="orb"></div>
      <div class="ring-3"></div>
    </div>
    <div class="status-text">THINKING...</div>
    <div class="confidence-bar">
      <div class="confidence-fill"></div>
    </div>
  </div>
  
  <div class="states">
    <button class="state-btn active" onclick="setState('thinking')">THINKING</button>
    <button class="state-btn" onclick="setState('processing')">PROCESSING</button>
    <button class="state-btn" onclick="setState('confident')">CONFIDENT</button>
  </div>

  <script>
    const states = {
      thinking: {
        color: '#00ccff',
        text: 'THINKING...',
        confidence: 35
      },
      processing: {
        color: '#00ccff',
        text: 'PROCESSING...',
        confidence: 65
      },
      confident: {
        color: '#00ff88',
        text: 'CONFIDENT',
        confidence: 95
      }
    };

    let currentState = 'thinking';

    function setState(state) {
      currentState = state;
      const config = states[state];
      
      // Update orb color
      document.querySelector('.orb').style.background = 
        `radial-gradient(circle at 30% 30%, ${config.color} 0%, ${adjustColor(config.color, -50)} 50%, ${adjustColor(config.color, -100)} 100%)`;
      
      // Update ring colors
      document.querySelectorAll('.orb::before, .orb::after, .ring-3').forEach(el => {
        el.style.borderColor = config.color + '80';
      });
      
      // Update text
      document.querySelector('.status-text').textContent = config.text;
      document.querySelector('.status-text').style.color = config.color;
      
      // Update confidence bar
      document.querySelector('.confidence-fill').style.width = config.confidence + '%';
      document.querySelector('.confidence-fill').style.background = 
        `linear-gradient(90deg, ${config.color}, ${adjustColor(config.color, 50)})`;
      
      // Update buttons
      document.querySelectorAll('.state-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent.toLowerCase() === state) {
          btn.classList.add('active');
        }
      });
    }

    function adjustColor(color, amount) {
      const hex = color.replace('#', '');
      const r = Math.max(0, Math.min(255, parseInt(hex.substr(0, 2), 16) + amount));
      const g = Math.max(0, Math.min(255, parseInt(hex.substr(2, 2), 16) + amount));
      const b = Math.max(0, Math.min(255, parseInt(hex.substr(4, 2), 16) + amount));
      return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
    }
  </script>
</body>
</html>
