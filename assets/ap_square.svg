<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- AP Body -->
  <rect x="50" y="50" width="300" height="300" rx="40" fill="#f8fafc" filter="url(#shadow)"/>
  
  <!-- Center Design -->
  <circle cx="200" cy="200" r="80" fill="none" stroke="#e2e8f0" stroke-width="4"/>
  <circle cx="200" cy="200" r="60" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- LED -->
  <circle cx="200" cy="200" r="15" fill="#3b82f6">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Logo -->
  <text x="170" y="320" font-family="Arial" font-size="12" fill="#94a3b8" font-weight="bold">NETGEAR</text>
</svg>
