<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <!-- Rack Cabinet -->
  <rect x="50" y="20" width="300" height="560" rx="5" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  
  <!-- Glass Door -->
  <rect x="70" y="40" width="260" height="520" rx="2" fill="#334155" fill-opacity="0.3" stroke="#475569" stroke-width="2"/>
  
  <!-- Rails -->
  <line x1="80" y1="40" x2="80" y2="560" stroke="#64748b" stroke-width="4" stroke-dasharray="20,10"/>
  <line x1="320" y1="40" x2="320" y2="560" stroke="#64748b" stroke-width="4" stroke-dasharray="20,10"/>
  
  <!-- Devices inside -->
  <rect x="90" y="100" width="220" height="30" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <rect x="90" y="140" width="220" height="80" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <rect x="90" y="240" width="220" height="30" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
</svg>
