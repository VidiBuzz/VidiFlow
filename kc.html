                id: 'troubleshooting',
                title: 'Troubleshooting',
                icon: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
                render: () => `
                     <header class="mb-8 fade-in" style="animation-delay: 0ms">
                        <h1 class="text-3xl font-bold text-slate-900 mb-2">Operational Excellence</h1>
                        <p class="text-lg text-slate-600">Diagnosing Common Failure Modes</p>
                    </header>
                    <div class="grid gap-6 fade-in" style="animation-delay: 100ms">
                        <div class="bg-white p-6 rounded-lg border border-slate-200 shadow-sm">
                            <h3 class="text-lg font-bold text-red-600 flex items-center gap-2 mb-3">Infinite Redirect Loop</h3>
                            <p class="text-slate-700"><strong>Fix:</strong> Ensure <code>KC_PROXY=edge</code> and <code>KC_HTTP_ENABLED=true</code> are set.</p>
                        </div>
                        <div class="bg-white p-6 rounded-lg border border-slate-200 shadow-sm">
                            <h3 class="text-lg font-bold text-amber-600 flex items-center gap-2 mb-3">"Cookie Not Found" / SSO Failure</h3>
                            <p class="text-slate-700"><strong>Fix:</strong> Switch to custom domain (<code>example-corp.com</code>) to bypass PSL restrictions.</p>
                        </div>
                         <div class="bg-white p-6 rounded-lg border border-slate-200 shadow-sm">
                            <h3 class="text-lg font-bold text-slate-700 flex items-center gap-2 mb-3">Internal Connection Refused</h3>
                             <p class="text-slate-700"><strong>Fix:</strong> Verify <code>client_secrets.json</code> uses <code>http://keycloak.railway.internal:8080</code>.</p>
                        </div>
                    </div>
                `
            }
        ];

        let activeIndex = 0;

        // --- Core Functions ---

        function init() {
            renderNav();
            renderContent(0);
        }

        function renderNav() {
            const nav = document.getElementById('nav-buttons');
            nav.innerHTML = sections.map((section, index) => `
                <button 
                    onclick="renderContent(${index})"
                    class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all text-left mb-1 ${index === activeIndex ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}"
                >
                    ${section.icon}
                    ${section.title}
                </button>
            `).join('');
        }

        function renderContent(index) {
            activeIndex = index;
            
            const contentArea = document.getElementById('main-content');
            
            // Render content
            contentArea.innerHTML = sections[index].render();
            
            // Update Indicators
            document.getElementById('page-indicator').innerText = `${index + 1} / ${sections.length}`;
            
            // Update Buttons
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            
            btnPrev.disabled = index === 0;
            btnNext.disabled = index === sections.length - 1;
            btnNext.innerHTML = index === sections.length - 1 
                ? 'Finish <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>'
                : 'Next Step <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            if(index === sections.length - 1) {
                btnNext.classList.add('bg-slate-100', 'text-slate-400');
                btnNext.classList.remove('bg-indigo-600', 'text-white');
            } else {
                btnNext.classList.remove('bg-slate-100', 'text-slate-400');
                btnNext.classList.add('bg-indigo-600', 'text-white');
            }

            // Close mobile menu if open
            closeMobileMenu();
            
            renderNav();
            document.getElementById('content-area').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigate(direction) {
            const newIndex = activeIndex + direction;
            if (newIndex >= 0 && newIndex < sections.length) {
                renderContent(newIndex);
            }
        }

        function openMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.remove('-translate-x-full');
            // We use translate-x-0 to show it on mobile
            sidebar.classList.add('translate-x-0'); 
            overlay.classList.remove('hidden');
        }

        function closeMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            // Re-hide on mobile
            sidebar.classList.add('-translate-x-full');
            sidebar.classList.remove('translate-x-0');
            overlay.classList.add('hidden');
        }

        function renderCodeBlock(lang, code, title) {
            const escapedCode = code.replace(/&/g, "&amp;")
                                    .replace(/</g, "&lt;")
                                    .replace(/>/g, "&gt;")
                                    .replace(/"/g, "&quot;")
                                    .replace(/'/g, "&#039;");

            return `
                <div class="my-6 rounded-lg overflow-hidden border border-slate-700 shadow-sm bg-[#1e1e1e]">
                    <div class="flex items-center justify-between px-4 py-2 bg-[#2d2d2d] border-b border-slate-700">
                        <span class="text-xs font-mono text-slate-300">${title || lang}</span>
                        <button onclick="copyToClipboard(this, \`${code.replace(/`/g, "\\`").replace(/\$/g, "\\$")}\`)" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copy
                        </button>
                    </div>
                    <div class="p-4 overflow-x-auto code-scroll">
                        <pre class="text-sm font-mono text-slate-50 leading-relaxed whitespace-pre"><code>${escapedCode}</code></pre>
                    </div>
                </div>
            `;
        }

        function copyToClipboard(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<span class="text-green-400 flex items-center gap-1">Copied!</span>`;
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                }, 2000);
            });
        }

        // Initialize on load to ensure DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            init();
        });

    </script>
</body>
</html>
