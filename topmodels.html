<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidiSmart | Frontier AI Comparison</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #6366f1;
            --brand-secondary: #06b6d4;
            --bg-main: #0a0c10;
        }

        body {
            background-color: var(--bg-main);
            color: #f8fafc;
            font-family: 'Kumbh Sans', sans-serif;
            background-image:
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        .vidi-gradient {
            background: linear-gradient(135deg, #818cf8 0%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .model-row {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .model-row:hover {
            background: rgba(255, 255, 255, 0.03);
            transform: scale(1.005);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(99, 102, 241, 0.3);
        }

        .badge {
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
        }

        .badge-vision {
            background: rgba(34, 211, 238, 0.15);
            color: #22d3ee;
            border: 1px solid rgba(34, 211, 238, 0.3);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.1);
        }

        .badge-text {
            background: rgba(248, 250, 252, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(248, 250, 252, 0.1);
        }

        .badge-instinct {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .badge-hx {
            background: rgba(236, 72, 153, 0.15);
            color: #f472b6;
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .badge-reasoning {
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .badge-search {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-free {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .price-tag {
            font-family: monospace;
            color: #818cf8;
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        /* ── Top Nav ── */
        .topnav {
            background: #0a0c10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            padding: 0 40px;
            display: flex;
            align-items: center;
            height: 50px;
            gap: 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .topnav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin-right: 22px;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            background: linear-gradient(135deg, #4f7fff, #7c5cfc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Kumbh Sans';
            font-size: 11px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.03em;
        }

        .brand-text {
            font-family: 'Kumbh Sans';
            font-size: 18px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.88);
            letter-spacing: -0.03em;
        }

        .brand-text span {
            color: rgba(255, 255, 255, 0.38);
            font-weight: 400;
        }

        .nav-sep {
            width: 1px;
            height: 22px;
            background: rgba(255, 255, 255, 0.09);
            margin: 0 6px;
        }

        .navlink {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 14px;
            height: 50px;
            font-size: 12.5px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.38);
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: color .15s, border-color .15s;
            white-space: nowrap;
        }

        .navlink:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .navlink.active {
            color: #f8fafc;
            border-bottom-color: #4f7fff;
        }

        .nl-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4f7fff;
            opacity: .6;
        }

        .navlink.active .nl-dot {
            opacity: 1;
        }

        @media(max-width:640px) {
            .topnav {
                padding: 0 16px;
            }

            .brand-text span {
                display: none;
            }
        }

        /* ── Local-Run Badge ── */
        .local-chip-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px 3px 5px;
            background: rgba(74, 222, 128, 0.08);
            border: 1px solid rgba(74, 222, 128, 0.38);
            border-radius: 8px;
            color: #4ade80;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            vertical-align: middle;
            margin-left: 7px;
            position: relative;
            cursor: default;
            animation: chipGlow 3s ease-in-out infinite;
        }

        .local-chip-badge::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 11px;
            border: 1px solid rgba(74, 222, 128, 0.5);
            animation: chipRingExpand 3s ease-out infinite;
            pointer-events: none;
        }

        @keyframes chipGlow {
            0%, 100% { box-shadow: 0 0 6px rgba(74, 222, 128, 0.12); }
            50%       { box-shadow: 0 0 16px rgba(74, 222, 128, 0.38); }
        }

        @keyframes chipRingExpand {
            0%   { transform: scale(1);   opacity: 0.7; border-color: rgba(74, 222, 128, 0.5); }
            80%  { transform: scale(1.35); opacity: 0;  border-color: rgba(74, 222, 128, 0); }
            100% { transform: scale(1.35); opacity: 0;  border-color: rgba(74, 222, 128, 0); }
        }

        .local-chip-icon {
            width: 12px;
            height: 12px;
            flex-shrink: 0;
            animation: chipBlink 3s ease-in-out infinite;
        }

        @keyframes chipBlink {
            0%, 100% { filter: drop-shadow(0 0 2px rgba(74, 222, 128, 0.5)); }
            50%       { filter: drop-shadow(0 0 5px rgba(74, 222, 128, 1)); }
        }

        /* ── VRAM column ─────────────────────────── */
        .vram-th { min-width: 108px; }
        .vram-cell { min-width: 108px; text-align: center; vertical-align: middle; }
        .vram-local { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .vram-num {
            font-size: 1.6rem;
            font-weight: 900;
            color: #4ade80;
            line-height: 1;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.02em;
            text-shadow: 0 0 18px rgba(74,222,128,0.45);
        }
        .vram-quant {
            font-size: 0.6rem;
            color: #4ade80;
            opacity: 0.65;
            letter-spacing: 0.06em;
            font-family: 'JetBrains Mono', monospace;
        }
        .vram-hw {
            font-size: 0.58rem;
            color: #475569;
            margin-top: 1px;
        }
        .vram-api {
            font-size: 0.68rem;
            color: #334155;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        /* ── end VRAM column ──────────────────────── */

        .local-vram {
            opacity: 0.75;
            font-weight: 600;
            font-size: 0.58rem;
        }

        /* Highlight vision-focused rows */
        .row-vision-highlight {
            background: rgba(34, 211, 238, 0.025) !important;
        }

        .badge-new {
            background: rgba(249, 115, 22, 0.15);
            color: #fb923c;
            border: 1px solid rgba(249, 115, 22, 0.3);
        }

        /* ── Hero Redesign ── */
        .site-brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 16px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 100px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: rgba(199, 210, 254, 0.8);
            margin-bottom: 1.4rem;
        }

        .site-brand-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #818cf8;
            animation: brandDot 2.5s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes brandDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.75); }
        }

        .page-hero-sub {
            color: rgba(148, 163, 184, 0.78);
            font-size: 1rem;
            max-width: 560px;
            margin: 0 auto 2rem;
            line-height: 1.65;
            font-weight: 300;
        }

        /* How-to strip */
        .howto-strip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .howto-step {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            padding: 0.45rem 0.9rem;
            font-size: 0.78rem;
            color: rgba(203, 213, 225, 0.82);
        }

        .howto-num {
            width: 20px; height: 20px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.25);
            border: 1px solid rgba(99, 102, 241, 0.45);
            color: #a5b4fc;
            font-size: 0.65rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .howto-arrow {
            color: rgba(100, 116, 139, 0.4);
            font-size: 0.85rem;
        }

        /* Route filter chips */
        .route-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }

        .route-chip {
            display: flex;
            align-items: center;
            gap: 0.38rem;
            padding: 0.52rem 1.1rem;
            background: rgba(12, 18, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            color: rgba(148, 163, 184, 0.78);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Kumbh Sans', sans-serif;
            transition: all 0.22s ease;
            letter-spacing: 0.01em;
        }

        .route-chip:hover {
            border-color: rgba(99, 102, 241, 0.4);
            color: white;
            background: rgba(99, 102, 241, 0.1);
        }

        .route-chip[data-filter="vision"].active  { background: rgba(34,211,238,0.14); border-color: rgba(34,211,238,0.55); color: #22d3ee; box-shadow: 0 0 18px rgba(34,211,238,0.12); }
        .route-chip[data-filter="local"].active   { background: rgba(74,222,128,0.14); border-color: rgba(74,222,128,0.55); color: #4ade80; box-shadow: 0 0 18px rgba(74,222,128,0.12); }
        .route-chip[data-filter="budget"].active  { background: rgba(251,191,36,0.14); border-color: rgba(251,191,36,0.55); color: #fbbf24; box-shadow: 0 0 18px rgba(251,191,36,0.12); }
        .route-chip[data-filter="frontier"].active{ background: rgba(168,85,247,0.14); border-color: rgba(168,85,247,0.55); color: #c084fc; box-shadow: 0 0 18px rgba(168,85,247,0.12); }
        .route-chip[data-filter="code"].active    { background: rgba(59,130,246,0.14); border-color: rgba(59,130,246,0.55); color: #60a5fa; box-shadow: 0 0 18px rgba(59,130,246,0.12); }

        /* Row dim / highlight states */
        .model-row { transition: opacity 0.25s ease, background 0.25s ease; }
        .model-row.row-dim { opacity: 0.15; pointer-events: none; }

        .model-row.row-highlight { background: rgba(255,255,255,0.03) !important; }
        .filter-vision   .model-row.row-highlight { border-left: 2px solid rgba(34,211,238,0.7)  !important; background: rgba(34,211,238,0.04) !important; }
        .filter-local    .model-row.row-highlight { border-left: 2px solid rgba(74,222,128,0.7)  !important; background: rgba(74,222,128,0.04) !important; }
        .filter-budget   .model-row.row-highlight { border-left: 2px solid rgba(251,191,36,0.7)  !important; background: rgba(251,191,36,0.04) !important; }
        .filter-frontier .model-row.row-highlight { border-left: 2px solid rgba(168,85,247,0.7)  !important; background: rgba(168,85,247,0.04) !important; }
        .filter-code     .model-row.row-highlight { border-left: 2px solid rgba(59,130,246,0.7)  !important; background: rgba(59,130,246,0.04) !important; }

        .filter-hint {
            display: none;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(100,116,139,0.7);
            margin-top: 0.5rem;
            letter-spacing: 0.03em;
        }
        .filter-hint.visible { display: block; }
            /* ── Capability Ratings ── */
        .cap-rating { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .cap-rating:last-child { margin-bottom: 0; }
        .cap-label { width: 95px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
        .seg-bar { display: flex; gap: 2px; flex: 1; }
        .seg { flex: 1; height: 8px; border-radius: 2px; background: rgba(255, 255, 255, 0.08); transition: all 0.3s ease; }
        .seg.on-v { background: #22d3ee; box-shadow: 0 0 5px rgba(34, 211, 238, 0.5); }
        .seg.on-r { background: #a78bfa; box-shadow: 0 0 5px rgba(167, 139, 250, 0.5); }
        .seg.on-t { background: #34d399; box-shadow: 0 0 5px rgba(52, 211, 153, 0.5); }
        .seg.on-i { background: #fbbf24; box-shadow: 0 0 5px rgba(251, 191, 36, 0.5); }

</head>

<script src="assets/js/smartstack-widget.js"></script>
<script>
(function () {
    // ── VRAM column injection ──────────────────────────────────────────
    const VRAM_DATA = {
        'Qwen 3.6 27B':   { gb: '17 GB', quant: 'Q4_K_M', hw: 'RTX 4090 / 3090' },
        'MiMo 2.5 Omni':  { gb: '8 GB',  quant: 'Q4',     hw: 'Any 8 GB GPU / M-series' },
    };

    // Insert header th (after Modality = 2nd th)
    const theadRow = document.querySelector('thead tr');
    if (theadRow) {
        const vramTh = document.createElement('th');
        vramTh.className = 'py-4 px-4 vram-th text-xs uppercase tracking-widest font-semibold text-slate-500 text-center w-[12%]';
        vramTh.textContent = 'Local VRAM';
        theadRow.insertBefore(vramTh, theadRow.children[2]);
    }

    // Insert td into every model row (after Modality td, index 1)
    document.querySelectorAll('.model-row').forEach(row => {
        const nameEl = row.querySelector('[class*="font-bold"][class*="text-lg"]');
        let raw = '';
        if (nameEl) {
            const clone = nameEl.cloneNode(true);
            clone.querySelectorAll('svg, i, .badge').forEach(el => el.remove());
            raw = clone.textContent.replace(/[\n\r\t]/g, '').replace(/\s+/g, ' ').replace(/[®™]/g, '').trim();
        }
        const v = VRAM_DATA[raw];
        const td = document.createElement('td');
        td.className = 'py-3 px-4 vram-cell';
        if (v) {
            td.innerHTML = `<div class="vram-local">
                <div class="vram-num">${v.gb}</div>
                <div class="vram-quant">${v.quant}</div>
                <div class="vram-hw">${v.hw}</div>
            </div>`;
        } else {
            td.innerHTML = `<span class="vram-api">API</span>`;
        }
        const cells = row.querySelectorAll('td');
        if (cells.length >= 2) row.insertBefore(td, cells[2]);
    });
    // ── end VRAM column ────────────────────────────────────────────────

    // Tag map — what task(s) each model serves
    const TAGS = {
        'MiniMax M3':        'vision frontier budget',
        'DeepSeek V4 Pro':   'code frontier budget',
        'MiniMax 2.5 Pro':   'code',
        'Kimi K 2.6':        'code',
        'Qwen 3.7 Max':      'code frontier',
        'Nemotron 3 Ultra':  'code frontier',
        'Qwen 3.7 Plus':     'vision code budget',
        'Qwen 3.6 Plus':     'vision code budget',
        'Qwen 3.6 27B':      'local code budget',
        'GLM-5.1':           'code',
        'MiMo 2.5 Omni':     'vision local budget',
        'MiMo 2.5 Pro':      'vision',
        'GLM-5V Turbo':      'vision',
        'Claude 4.6 Sonnet': 'vision frontier code',
        'Gemini 3.1 Pro':    'vision frontier',
        'Gemini 3.5 Flash':  'vision',
        'StepFun 3.7':       'budget',
    };

    // Auto-assign data-tags to every model row
    document.querySelectorAll('.model-row').forEach(row => {
        const nameEl = row.querySelector('[class*="font-bold"][class*="text-lg"]');
        if (!nameEl) return;
        const clone = nameEl.cloneNode(true);
        clone.querySelectorAll('svg, i, .badge').forEach(el => el.remove());
        const raw = clone.textContent.replace(/[\n\r\t]/g, '').replace(/\s+/g, ' ').replace(/[®™]/g, '').trim();
        const tags = TAGS[raw];
        if (tags) row.dataset.tags = tags;
    });

    // Filter chip interaction
    const chips  = document.querySelectorAll('.route-chip[data-filter]');
    const rows   = document.querySelectorAll('.model-row[data-tags]');
    const tbody  = document.querySelector('tbody');
    const hint   = document.getElementById('filterHint');

    chips.forEach(chip => {
        chip.addEventListener('click', () => {
            const filter   = chip.dataset.filter;
            const isActive = chip.classList.contains('active');

            // Reset everything
            chips.forEach(c => c.classList.remove('active'));
            rows.forEach(r => r.classList.remove('row-highlight', 'row-dim'));
            tbody.className = '';
            hint.classList.remove('visible');

            if (!isActive) {
                chip.classList.add('active');
                tbody.classList.add('filter-' + filter);
                hint.classList.add('visible');
                rows.forEach(row => {
                    const tags = (row.dataset.tags || '').split(' ');
                    row.classList.add(tags.includes(filter) ? 'row-highlight' : 'row-dim');
                });
                // Smooth scroll to table
                document.querySelector('.glass-panel.overflow-hidden')
                    ?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    });
})();
</script>
