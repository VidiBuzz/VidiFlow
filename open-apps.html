<style>
:root{--bg:#0d0f14;--surface:#141720;--surface2:#1c2030;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#e8eaf2;--muted:#6b7280;--muted2:#3d4455;--accent:#4f7fff;--accent2:#7c5cfc;--radius:10px;--font:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',monospace;--brand:'Kumbh Sans',system-ui,sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;min-height:100vh;}
.l-next{--lc:#00d8ff;--lb:rgba(0,216,255,0.1);}
.l-node{--lc:#68a063;--lb:rgba(104,160,99,0.1);}
.l-go{--lc:#00acd7;--lb:rgba(0,172,215,0.1);}
.l-rust{--lc:#f5813f;--lb:rgba(245,129,63,0.1);}
.l-python{--lc:#ffd43b;--lb:rgba(255,212,59,0.1);}
.l-ruby{--lc:#cc342d;--lb:rgba(204,52,45,0.1);}
.l-php{--lc:#7a86b8;--lb:rgba(122,134,184,0.08);}
.l-java{--lc:#f89820;--lb:rgba(248,152,32,0.1);}
.l-csharp{--lc:#9b4f96;--lb:rgba(155,79,150,0.1);}
.l-kotlin{--lc:#7f52ff;--lb:rgba(127,82,255,0.1);}
.l-c{--lc:#a8b9cc;--lb:rgba(168,185,204,0.1);}
.l-elixir{--lc:#6e4a7e;--lb:rgba(110,74,126,0.1);}
.l-cpp{--lc:#00599c;--lb:rgba(0,89,156,0.1);}



/* ── Header ── */
.header{padding:36px 40px 24px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(79,127,255,0.05) 0%,transparent 100%);}
.header-inner{max-width:1440px;margin:0 auto;}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.logo-dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;}
.logo-dot svg{width:12px;height:12px;fill:white;}
.logo-name{font-size:13px;font-weight:500;color:var(--muted);}
h1{font-size:27px;font-weight:300;letter-spacing:-0.04em;margin-bottom:4px;}
h1 strong{font-weight:600;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:20px;}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;max-width:360px;min-width:180px;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;}
.search-icon svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.8;}
input[type=search]{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--font);font-size:13px;padding:8px 12px 8px 34px;outline:none;transition:border-color .15s;}
input[type=search]:focus{border-color:var(--accent);}
input[type=search]::placeholder{color:var(--muted);}
.toggle-btn{padding:6px 12px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:var(--font);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.toggle-btn.active{background:rgba(79,127,255,0.1);border-color:rgba(79,127,255,0.35);color:var(--accent);}
.toggle-btn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.count-badge{font-size:11px;color:var(--muted);font-family:var(--mono);padding:5px 9px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;white-space:nowrap;}

/* ── Main ── */
.main{max-width:1440px;margin:0 auto;padding:24px 40px 60px;}
.filter-row{display:flex;gap:20px;margin-bottom:16px;flex-wrap:wrap;align-items:flex-start;}
.filter-group{display:flex;flex-direction:column;gap:6px;}
.filter-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted2);font-weight:500;}
.pills{display:flex;flex-wrap:wrap;gap:5px;}
.pill{padding:4px 11px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;}
.pill:hover{border-color:var(--border2);color:var(--text);}
.pill.active{border-color:rgba(79,127,255,0.3);color:var(--accent);background:rgba(79,127,255,0.08);}
.lang-pills .pill.active{border-color:color-mix(in srgb,var(--lc,var(--accent)) 50%,transparent);color:var(--lc,var(--accent));background:var(--lb,rgba(79,127,255,0.08));}
.sep{width:1px;background:var(--border);margin:4px 0;align-self:stretch;}
.legend{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap;}
.li{display:flex;align-items:center;gap:5px;}
.ld{width:7px;height:7px;border-radius:50%;}

/* ── Cards ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:10px;}
.app-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 13px 12px;display:block;text-decoration:none;transition:border-color .15s,background .15s;}
.app-card:hover{border-color:var(--border2);background:var(--surface2);}
.app-card.cn{border-color:rgba(79,127,255,0.18);}
.app-card.cn:hover{border-color:rgba(79,127,255,0.38);}
.app-card.php-dim{opacity:0.5;}
.app-card.php-dim:hover{opacity:0.75;}

/* Icon */
.icon-wrap{position:relative;width:40px;height:40px;margin-bottom:10px;}
.app-img{width:40px;height:40px;border-radius:9px;object-fit:contain;visibility:hidden;position:absolute;top:0;left:0;background:var(--surface2);}
.app-icon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-family:var(--mono);letter-spacing:-0.02em;text-transform:uppercase;position:relative;z-index:1;}

.card-top-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:2px;}
.c-great{background:#4caf50;box-shadow:0 0 5px rgba(76,175,80,0.5);}
.c-good{background:#00acd7;box-shadow:0 0 5px rgba(0,172,215,0.35);}
.c-ok{background:#ff9800;}
.c-php{background:#3d4455;}

.app-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.app-tag{font-size:11.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:28px;}
.card-foot{margin-top:9px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
.lang-badge{font-size:10px;padding:2px 7px;border-radius:4px;font-family:var(--mono);font-weight:500;background:var(--lb);color:var(--lc);border:1px solid color-mix(in srgb,var(--lc) 18%,transparent);white-space:nowrap;}
.site-domain{font-size:10px;color:var(--muted2);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;}

.empty{text-align:center;padding:60px 0;color:var(--muted);grid-column:1/-1;font-size:14px;}
@media(max-width:640px){.header,.main{padding-left:16px;padding-right:16px;}.grid{grid-template-columns:1fr 1fr;}}
</style>
</head>

const LANGS={next:{label:'Next.js',cls:'l-next'},node:{label:'Node/TS',cls:'l-node'},go:{label:'Go',cls:'l-go'},rust:{label:'Rust',cls:'l-rust'},python:{label:'Python',cls:'l-python'},ruby:{label:'Ruby',cls:'l-ruby'},php:{label:'PHP',cls:'l-php'},java:{label:'Java/JVM',cls:'l-java'},csharp:{label:'C#/.NET',cls:'l-csharp'},kotlin:{label:'Kotlin',cls:'l-kotlin'},c:{label:'C/C++',cls:'l-c'},elixir:{label:'Elixir',cls:'l-elixir'},cpp:{label:'C++',cls:'l-cpp'}};
const CATS={all:'All',ai:'AI',analytics:'Analytics',cms:'CMS',comm:'Comms',database:'Database',dev:'Dev',doc:'Docs',ecommerce:'E-commerce',email:'Email',file:'Files',finance:'Finance',game:'Gaming',media:'Media',monitor:'Monitoring',pm:'Projects',sec:'Security',social:'Social',stream:'Streaming DB',tools:'Tools'};
const CC={ai:['#1a2744','#4f7fff'],analytics:['#14201e','#00bcd4'],cms:['#1e2118','#5cb85c'],comm:['#211a30','#9b59b6'],database:['#1a2532','#3498db'],dev:['#201e14','#e67e22'],doc:['#1a2532','#3498db'],ecommerce:['#1e2210','#8bc34a'],email:['#22181e','#e91e8c'],file:['#1a2520','#1abc9c'],finance:['#1e2210','#8bc34a'],game:['#141e14','#61c04a'],media:['#201428','#e040fb'],monitor:['#141e20','#00e5ff'],pm:['#1e1a14','#ff7043'],sec:['#1c1424','#7c5cfc'],social:['#1a2018','#4caf50'],stream:['#1a1e14','#76ff03'],tools:['#201a14','#ff5722']};

let curCat='all',curLang='all',hidePhp=false,dirOnly=false,sq='';
function ini(n){return n.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase().slice(0,2);}

function filtered(overrideCat, overrideLang){
  const q=sq.toLowerCase();
  const cat=overrideCat!==undefined?overrideCat:curCat;
  const lang=overrideLang!==undefined?overrideLang:curLang;
  const seen=new Set();
  return APPS.filter(a=>{
    if(seen.has(a.id))return false;seen.add(a.id);
    if(hidePhp&&a.lang==='php')return false;
    if(dirOnly&&(a.lang==='php'||a.compat==='ok'||a.compat==='php'))return false;
    if(cat!=='all'&&a.cat!==cat)return false;
    if(lang!=='all'&&a.lang!==lang)return false;
    if(q&&!a.name.toLowerCase().includes(q)&&!a.tag.toLowerCase().includes(q)&&!a.stack.toLowerCase().includes(q)&&!(a.site||'').includes(q))return false;
    return true;
  });
}

function render(){
  const f=filtered();
  const cp=document.getElementById('catPills');
  cp.innerHTML=Object.entries(CATS).map(([k,v])=>{
    const n=k==='all'?filtered('all',curLang).length:filtered(k,curLang).length;
    return `<button class="pill${k===curCat?' active':''}" data-cat="${k}">${v} <small style="opacity:.5;font-size:10px">${n}</small></button>`;
  }).join('');
  cp.querySelectorAll('.pill').forEach(b=>b.addEventListener('click',()=>{curCat=b.dataset.cat;render();}));
  const lp=document.getElementById('langPills');
  lp.innerHTML=`<button class="pill${curLang==='all'?' active':''}" data-lang="all">All <small style="opacity:.5;font-size:10px">${filtered(curCat,'all').length}</small></button>`+
    Object.entries(LANGS).map(([k,v])=>{
      const n=filtered(curCat,k).length;
      return `<button class="pill ${v.cls}${k===curLang?' active':''}" data-lang="${k}">${v.label} <small style="opacity:.5;font-size:10px">${n}</small></button>`;
    }).join('');
  lp.querySelectorAll('.pill').forEach(b=>b.addEventListener('click',()=>{curLang=b.dataset.lang;render();}));
  document.getElementById('countBadge').textContent=f.length+' apps';
  document.getElementById('subtitle').textContent=f.length+' free self-hosted apps · stack badges, Directus compatibility, and direct links to every app\'s website';
  if(!f.length){document.getElementById('grid').innerHTML='<div class="empty">No apps match your filters</div>';return;}
  document.getElementById('grid').innerHTML=f.map(a=>{
    const[bg,fg]=CC[a.cat]||CC.tools;
    const li=LANGS[a.lang]||LANGS.node;
    const storeHref=`https://www.cloudron.io/store/app.${a.id}.html`;
    const siteHref=a.site?`https://${a.site}`:storeHref;
    // Use Google Favicons directly - Clearbit is blocked
    const imgSrc=a.site?`https://www.google.com/s2/favicons?domain=${a.site}&sz=64`:'';
    const iconBlock=a.site
      ?`<img class="app-img" src="${imgSrc}" alt=""
          onload="this.style.visibility='visible';this.style.position='relative';this.nextElementSibling.style.visibility='hidden';this.nextElementSibling.style.position='absolute';"
          onerror="this.style.visibility='hidden';this.style.position='absolute';this.nextElementSibling.style.visibility='visible';this.nextElementSibling.style.position='relative';">
        <div class="app-icon" style="background:${bg};color:${fg}">${ini(a.name)}</div>`
      :`<div class="app-icon" style="background:${bg};color:${fg}">${ini(a.name)}</div>`;
    return `<a class="app-card${a.lang==='php'?' php-dim':''}${a.compat==='great'?' cn':''}" href="${siteHref}" target="_blank" rel="noopener">
      <div class="card-top-row">
        <div class="icon-wrap">${iconBlock}</div>
        <span class="cdot c-${a.compat}" title="Directus compat: ${a.compat}"></span>
      </div>
      <div class="app-name" title="${a.name}">${a.name}</div>
      <div class="app-tag">${a.tag}</div>
      <div class="card-foot">
        <span class="lang-badge ${li.cls}">${a.stack}</span>
        ${a.site?`<span class="site-domain">${a.site}</span>`:''}
      </div>
    </a>`;
  }).join('');
}

document.getElementById('search').addEventListener('input',e=>{sq=e.target.value;render();});
document.getElementById('hidePhpBtn').addEventListener('click',function(){hidePhp=!hidePhp;this.classList.toggle('active',hidePhp);render();});
document.getElementById('directusBtn').addEventListener('click',function(){dirOnly=!dirOnly;this.classList.toggle('active',dirOnly);render();});
render();
</script>
</body>
</html>
