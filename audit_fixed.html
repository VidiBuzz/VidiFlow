<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: sans-serif;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            border: 1px solid #333;
            padding: 10px;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        .label {
            margin-top: 5px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>

<body>
    <h1>Audit Fixed MaxRes Images</h1>
    <div class="grid">
        <div class="card"><img src="https://img.youtube.com/vi/mCFMn0UkRt0/maxresdefault.jpg">
            <div class="label">Veo (FIXED)</div>
        </div>
        <div class="card"><img src="https://img.youtube.com/vi/nEuNwULfGXk/maxresdefault.jpg">
            <div class="label">Imagen 3 (FIXED)</div>
        </div>
        <div class="card"><img src="https://img.youtube.com/vi/JcDBFAm9PPI/maxresdefault.jpg">
            <div class="label">Project Astra (FIXED)</div>
        </div>
        <div class="card"><img src="https://img.youtube.com/vi/qUbx5RC8ro4/maxresdefault.jpg">
            <div class="label">Genie 2 (NEW)</div>
        </div>
    </div>
</body>

</html>
