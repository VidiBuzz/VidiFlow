<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidiSmart | Master Tech Stack 2026 (Full)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="vidi-nav-component.css">
    <script src="vidi-nav-component.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg-dark: #020617;
            --accent: #38bdf8;
            --sidebar-w: 280px;
        }

        body {
            background-color: var(--bg-dark);
            color: #f1f5f9;
            font-family: 'Kumbh Sans', sans-serif;
            scroll-behavior: smooth;
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar-link.active {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border-right: 3px solid var(--accent);
        }

        .tech-item {
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .tech-item:hover {
            background: rgba(255, 255, 255, 0.03);
            transform: scale(1.02);
        }

        .tech-item:hover .external-icon {
            opacity: 1;
        }

        .external-icon {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .logo-box {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: white;
            padding: 4px;
            flex-shrink: 0;
        }

        /* Hide scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .comparison-table th {
            background: rgba(30, 41, 59, 0.8);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1rem;
        }
    </style>
</head>

<body class="antialiased">

    <!-- Navigation injected by vidi-nav-component.js -->

    <!-- Original Sub-Header (retained for search/export) -->
    <div class="h-16 glass z-40 flex items-center justify-between px-6 border-b border-slate-800 mb-6 md:ml-[280px]">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-sky-500 rounded-lg flex items-center justify-center">
                <i class="fas fa-eye text-white text-sm"></i>
            </div>
            <h1 class="font-bold text-lg tracking-tight">VidiSmart <span class="text-sky-400 font-normal">Master
                    Stack</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="relative hidden lg:block">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                <input type="text" placeholder="Search 481 technologies..."
                    class="bg-slate-900 border border-slate-700 rounded-full py-1.5 pl-10 pr-4 text-sm focus:outline-none focus:border-sky-500 w-64">
            </div>
            <button
                class="bg-sky-500 hover:bg-sky-400 text-slate-900 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider transition-all">
                Export 2026 Specs
            </button>
        </div>
    </div>

    <!-- Sidebar Navigation -->
    <aside
        class="fixed left-0 top-[80px] bottom-0 w-[280px] border-r border-slate-800 overflow-y-auto no-scrollbar hidden md:block bg-slate-950/50">
        <nav class="p-4 space-y-1" id="sidebar-nav">
            <!-- Navigation links will be injected here via JS -->
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="md:ml-[280px] pt-24 px-6 pb-20 max-w-6xl mx-auto" id="main-content">
        <!-- Hero Title with Stats Dashboard -->
        <div
            class="mb-8 relative overflow-hidden rounded-2xl border border-amber-500/20 glass p-8 shadow-[0_0_30px_rgba(245,158,11,0.05)]">
            <div class="absolute inset-0 bg-cover bg-center opacity-40 mix-blend-color-dodge transition-transform duration-1000 hover:scale-[1.02]"
                style="background-image: url('https://cdn.vidi.news/nano_banana_hero_graphic.png'); filter: contrast(1.1) brightness(1.2);">
            </div>
            <div class="absolute inset-0 bg-gradient-to-r from-[#020617] via-[#020617]/80 to-transparent"></div>

            <div class="relative z-10 w-full mb-8">
                <div
                    class="inline-flex items-center gap-2 bg-gradient-to-r from-amber-500/20 to-transparent border-l-2 border-amber-400 text-amber-300 px-3 py-1 mb-6 text-xs font-bold uppercase tracking-wider backdrop-blur-sm">
                    <i class="fas fa-bolt text-amber-400"></i> Nano Banana 2 Edition
                </div>

                <div class="flex items-center gap-4 mb-4">
                    <img referrerpolicy="no-referrer" src="https://cdn.vidi.news/images/VidiSmart5.png" alt="VidiSmart"
                        class="h-14 w-auto drop-shadow-[0_0_15px_rgba(56,189,248,0.3)]">
                    <h2
                        class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-300 tracking-tight">
                        Master Tech Stack</h2>
                </div>
                <p class="text-slate-300/90 max-w-2xl text-lg leading-relaxed shadow-black drop-shadow-md">
                    Comprehensive architecture map for building intelligent systems. Curated stack of <span
                        class="text-amber-400 font-bold drop-shadow-[0_0_8px_rgba(245,158,11,0.5)]"
                        id="total-count">500+</span> technologies across <span class="text-sky-400 font-bold">21</span>
                    categories.
                </p>
            </div>

            <!-- Stats Dashboard -->
            <div class="glass rounded-xl p-4 border border-slate-800">
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 text-center text-xs">
                    <div class="bg-slate-900/50 rounded-lg p-2">
                        <div class="text-sky-400 font-bold text-lg" id="count-vision">20</div>
                        <div class="text-slate-500">Vision AI</div>
                    </div>
                    <div class="bg-slate-900/50 rounded-lg p-2">
                        <div class="text-sky-400 font-bold text-lg" id="count-video">20</div>
                        <div class="text-slate-500">Video AI</div>
                    </div>
                    <div class="bg-slate-900/50 rounded-lg p-2">
                        <div class="text-sky-400 font-bold text-lg" id="count-llm">75</div>
                        <div class="text-slate-500">LLMs</div>
                    </div>
                    <div class="bg-slate-900/50 rounded-lg p-2">
                        <div class="text-sky-400 font-bold text-lg" id="count-voice">20</div>
                        <div class="text-slate-500">Voice AI</div>
                    </div>
                    <div class="bg-slate-900/50 rounded-lg p-2">
                        <div class="text-sky-400 font-bold text-lg" id="count-backend">20</div>
                        <div class="text-slate-500">Backend</div>
                    </div>
                    <div class="bg-slate-900/50 rounded-lg p-2">
                        <div class="text-sky-400 font-bold text-lg" id="count-frontend">20</div>
                        <div class="text-slate-500">Frontend</div>
                    </div>
                    <div class="bg-slate-900/50 rounded-lg p-2 col-span-2 md:col-span-1">
                        <div class="text-emerald-400 font-bold text-lg" id="count-total">500+</div>
                        <div class="text-slate-500">Total</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section List will be injected here -->
        <div id="stack-sections" class="space-y-20"></div>
    </main>

    <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        

    </script>
</body>

</html>
