<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>VidiSmart Smart Book — Expansion Plan Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=Kumbh+Sans:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --fire:#FF6B35; --fire-dark:#D4551F; --gold:#C8A951;
  --teal:#10B981; --purple:#8B5CF6; --blue:#3B82F6;
  --bg:#060914; --bg2:#0a0f1e; --bg-card:rgba(255,255,255,.04);
  --border:rgba(255,255,255,.09); --border-bright:rgba(255,255,255,.18);
  --text:#E2E8F0; --text-dim:rgba(255,255,255,.55); --text-faint:rgba(255,255,255,.35);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}

/* ── Slide system ── */
#deck{position:fixed;inset:0;display:flex;flex-direction:column}
.slide{position:absolute;inset:0;display:none;flex-direction:column;
  padding:2.5rem 3.5rem 3.5rem;overflow-y:auto}
.slide.active{display:flex;animation:slideIn .4s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── Nav bar ── */
.nav-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:.65rem 1.5rem;background:rgba(6,9,20,.92);
  backdrop-filter:blur(16px);border-top:1px solid var(--border)}
.nav-left,.nav-right{display:flex;align-items:center;gap:.6rem}
.nav-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text);
  padding:.4rem .9rem;border-radius:6px;font-size:.78rem;font-weight:600;
  cursor:pointer;transition:all .15s;font-family:inherit}
.nav-btn:hover{border-color:var(--fire);color:#fff;background:rgba(255,107,53,.1)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-counter{font-size:.78rem;font-weight:700;color:var(--gold);letter-spacing:1px;min-width:70px;text-align:center}
.nav-title{font-size:.72rem;font-weight:600;color:var(--text-faint);letter-spacing:2px;text-transform:uppercase}

/* ── Progress bar ── */
.progress-bar{position:fixed;top:0;left:0;height:3px;
  background:linear-gradient(90deg,var(--fire),var(--gold));z-index:101;
  transition:width .3s ease}

/* ── Typography ── */
.eyebrow{font-size:.65rem;font-weight:700;letter-spacing:4px;
  text-transform:uppercase;color:var(--fire);margin-bottom:.6rem}
.slide-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.2rem,4.5vw,3.8rem);
  letter-spacing:1.5px;color:#fff;line-height:.95;margin-bottom:.5rem}
.slide-title .accent{color:var(--fire)}
.slide-sub{font-family:'DM Serif Display',serif;font-style:italic;
  font-size:clamp(1rem,1.6vw,1.25rem);color:var(--text-dim);margin-bottom:2rem}
.slide-body{flex:1;font-size:clamp(.9rem,1.1vw,1.05rem);line-height:1.65}

/* ── Card grids ── */
.grid{display:grid;gap:1rem;width:100%}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
  padding:1.1rem 1.25rem;transition:border-color .2s}
.card:hover{border-color:var(--border-bright)}
.card-num{font-family:'Kumbh Sans',sans-serif;font-size:.7rem;font-weight:800;
  letter-spacing:2px;color:var(--gold);margin-bottom:.4rem}
.card-title{font-size:.95rem;font-weight:700;color:#fff;margin-bottom:.4rem}
.card-desc{font-size:.82rem;color:var(--text-dim);line-height:1.5}

/* ── Stat blocks ── */
.stat-row{display:flex;gap:2rem;flex-wrap:wrap;margin:1.5rem 0}
.stat{text-align:left}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,3.5vw,3rem);
  color:var(--fire);line-height:1}
.stat-label{font-size:.75rem;color:var(--text-dim);margin-top:.2rem;max-width:140px}

/* ── Table ── */
.tbl{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:.5rem}
.tbl th{text-align:left;padding:.5rem .7rem;font-weight:700;font-size:.68rem;
  letter-spacing:1px;text-transform:uppercase;color:var(--gold);
  border-bottom:1px solid var(--border)}
.tbl td{padding:.5rem .7rem;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text-dim)}
.tbl td strong{color:#fff}

/* ── Pill ── */
.pill{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;padding:.2rem .6rem;border-radius:20px}
.pill-fire{background:rgba(255,107,53,.15);color:var(--fire)}
.pill-gold{background:rgba(200,169,81,.15);color:var(--gold)}
.pill-teal{background:rgba(16,185,129,.15);color:var(--teal)}
.pill-purple{background:rgba(139,92,246,.15);color:var(--purple)}
.pill-blue{background:rgba(59,130,246,.15);color:var(--blue)}

/* ── Tier card ── */
.tier{border:1px solid var(--border);border-radius:12px;padding:1.25rem;overflow:hidden;position:relative}
.tier-free{border-color:rgba(16,185,129,.3)}
.tier-builder{border-color:rgba(59,130,246,.3)}
.tier-business{border-color:rgba(255,107,53,.3)}
.tier-enterprise{border-color:rgba(200,169,81,.3)}
.tier-name{font-family:'Kumbh Sans',sans-serif;font-size:1.1rem;font-weight:800;color:#fff;margin-bottom:.2rem}
.tier-price{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;line-height:1;margin-bottom:.8rem}
.tier-free .tier-price{color:var(--teal)}
.tier-builder .tier-price{color:var(--blue)}
.tier-business .tier-price{color:var(--fire)}
.tier-enterprise .tier-price{color:var(--gold)}
.tier-price small{font-size:.8rem;font-family:'DM Sans',sans-serif;font-weight:400;color:var(--text-faint)}
.tier-list{list-style:none;padding:0;margin:0}
.tier-list li{font-size:.78rem;color:var(--text-dim);padding:.25rem 0;
  padding-left:1.2rem;position:relative;line-height:1.4}
.tier-list li::before{content:'✓';position:absolute;left:0;color:var(--teal);font-weight:700}

/* ── Two-column ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1rem}
@media(max-width:700px){.two-col{grid-template-columns:1fr}}
.col-box{border:1px solid var(--border);border-radius:12px;padding:1.25rem}
.col-box h4{font-family:'Kumbh Sans',sans-serif;font-size:.85rem;font-weight:800;
  letter-spacing:1px;text-transform:uppercase;margin-bottom:.6rem}
.col-box p{font-size:.82rem;color:var(--text-dim);line-height:1.5}

/* ── Build order ── */
.step-list{list-style:none;padding:0;counter-reset:step}
.step-list li{display:flex;align-items:flex-start;gap:1rem;padding:.7rem 0;
  counter-increment:step;border-bottom:1px solid rgba(255,255,255,.04)}
.step-list li::before{content:counter(step);flex-shrink:0;width:2rem;height:2rem;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--fire),var(--gold));
  border-radius:50%;font-family:'Kumbh Sans',sans-serif;font-weight:800;
  font-size:.8rem;color:#fff}
.step-text strong{display:block;color:#fff;font-size:.9rem;margin-bottom:.1rem}
.step-text span{font-size:.78rem;color:var(--text-dim)}
.step-meta{margin-left:auto;font-size:.68rem;font-weight:700;color:var(--gold);
  white-space:nowrap;align-self:center}

/* ── Misc ── */
.callout{border-left:3px solid var(--fire);padding:.8rem 1.2rem;margin:1rem 0;
  background:rgba(255,107,53,.06);border-radius:0 8px 8px 0;font-size:.85rem;color:var(--text-dim)}
.callout strong{color:#fff}
.surface-badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.7rem;
  font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:.3rem}
.surface-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
</style>
</head>

// ── Deck engine ────────────────────────────────────────
var idx = 0;
var deck = document.getElementById('deck');

function buildSlides(){
  deck.innerHTML = '';
  SLIDES.forEach(function(s, i){
    var el = document.createElement('div');
    el.className = 'slide';
    el.setAttribute('data-idx', i);
    el.innerHTML = s.render();
    deck.appendChild(el);
  });
  show(0);
}

function show(n){
  idx = Math.max(0, Math.min(SLIDES.length - 1, n));
  document.querySelectorAll('.slide').forEach(function(el, i){
    el.classList.toggle('active', i === idx);
  });
  var pct = ((idx + 1) / SLIDES.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('navCounter').textContent = (idx + 1) + ' / ' + SLIDES.length;
  document.getElementById('navTitle').textContent = SLIDES[idx].title;
  document.getElementById('prevBtn').disabled = (idx === 0);
  document.getElementById('nextBtn').disabled = (idx === SLIDES.length - 1);
  deck.scrollTop = 0;
  var active = document.querySelector('.slide.active');
  if(active) active.scrollTop = 0;
}

function go(dir){ show(idx + dir); }

document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(1); }
  if(e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  if(e.key === 'Home') { e.preventDefault(); show(0); }
  if(e.key === 'End') { e.preventDefault(); show(SLIDES.length - 1); }
});

buildSlides();
</script>
