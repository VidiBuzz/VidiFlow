<!DOCTYPE html>
<html>
<head>
  <title>VidiFlow - Force Graph with Data Flow</title>
  <script src="https://unpkg.com/3d-force-graph"></script>
  <script src="https://unpkg.com/three"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0a0a1a; 
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    #graph { width: 100vw; height: 100vh; }
    
    .legend {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(10, 10, 26, 0.9);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      z-index: 100;
    }
    .legend h3 { margin-bottom: 12px; color: #00ccff; font-size: 14px; }
    .legend-item { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 12px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
    
    .stats {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(10, 10, 26, 0.9);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      z-index: 100;
      font-size: 12px;
    }
    .stat-row { display: flex; justify-content: space-between; gap: 20px; margin: 6px 0; }
    .stat-label { color: #888; }
    .stat-value { color: #00ff88; font-weight: 600; }
  </style>
</head>
<body>
  <div id="graph"></div>
  
  <div class="legend">
    <h3>VIDIFLOW NODES</h3>
    <div class="legend-item"><div class="legend-dot" style="background: #00ff88"></div> Agent (RUN)</div>
    <div class="legend-item"><div class="legend-dot" style="background: #ffaa00"></div> Agent (HOT)</div>
    <div class="legend-item"><div class="legend-dot" style="background: #ff4444"></div> Agent (ERR)</div>
    <div class="legend-item"><div class="legend-dot" style="background: #00ccff"></div> Agent (HOLD)</div>
    <div class="legend-item"><div class="legend-dot" style="background: #666"></div> Agent (IDLE)</div>
    <div style="margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px;"></div>
    <div class="legend-item"><div class="legend-dot" style="background: #ff6600"></div> Task (BLOCKED)</div>
    <div class="legend-item"><div class="legend-dot" style="background: #00ff00"></div> Task (READY)</div>
    <div style="margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px;"></div>
    <div class="legend-item"><div class="legend-dot" style="background: #00ccff"></div> Server (Healthy)</div>
    <div class="legend-item"><div class="legend-dot" style="background: #ffaa00"></div> Server (Warning)</div>
    <div class="legend-item"><div class="legend-dot" style="background: #ff4444"></div> Server (Critical)</div>
  </div>
  
  <div class="stats">
    <h3 style="color: #00ccff; margin-bottom: 12px;">LIVE STATS</h3>
    <div class="stat-row"><span class="stat-label">Nodes:</span><span class="stat-value" id="nodeCount">0</span></div>
    <div class="stat-row"><span class="stat-label">Links:</span><span class="stat-value" id="linkCount">0</span></div>
    <div class="stat-row"><span class="stat-label">Particles:</span><span class="stat-value" id="particleCount">0</span></div>
    <div class="stat-row"><span class="stat-label">FPS:</span><span class="stat-value" id="fps">0</span></div>
  </div>

  <script>
    // Mock Neo4j data - Agents, Tasks, Servers
    const nodes = [
      // Agents
      { id: 'agent-001', label: 'Agent', name: 'Research Alpha', status: 'RUN', project: 'alpha', metrics: { tokensPerSec: 1250, memory: 0.72, cost: 0.45 } },
      { id: 'agent-002', label: 'Agent', name: 'Analysis Beta', status: 'HOT', project: 'beta', metrics: { tokensPerSec: 800, memory: 0.85, cost: 0.32 } },
      { id: 'agent-003', label: 'Agent', name: 'Pipeline Gamma', status: 'RUN', project: 'gamma', metrics: { tokensPerSec: 1500, memory: 0.65, cost: 0.28 } },
      { id: 'agent-004', label: 'Agent', name: 'Monitor Delta', status: 'ERR', project: 'alpha', metrics: { tokensPerSec: 0, memory: 0.95, cost: 0.12 } },
      { id: 'agent-005', label: 'Agent', name: 'Builder Epsilon', status: 'HOLD', project: 'beta', metrics: { tokensPerSec: 0, memory: 0.45, cost: 0.08 } },
      { id: 'agent-006', label: 'Agent', name: 'Scanner Zeta', status: 'RUN', project: 'shared', metrics: { tokensPerSec: 2000, memory: 0.58, cost: 0.55 } },
      { id: 'agent-007', label: 'Agent', name: 'Validator Eta', status: 'IDLE', project: 'gamma', metrics: { tokensPerSec: 0, memory: 0.22, cost: 0.01 } },
      { id: 'agent-008', label: 'Agent', name: 'Optimizer Theta', status: 'RUN', project: 'alpha', metrics: { tokensPerSec: 1800, memory: 0.78, cost: 0.42 } },
      
      // Tasks
      { id: 'task-001', label: 'Task', name: 'Generate Report', status: 'BLOCKED', impact: 66, severity: 'critical' },
      { id: 'task-002', label: 'Task', name: 'Process Queue', status: 'READY', impact: 12, severity: 'high' },
      { id: 'task-003', label: 'Task', name: 'Sync Data', status: 'BLOCKED', impact: 34, severity: 'medium' },
      { id: 'task-004', label: 'Task', name: 'Validate Input', status: 'READY', impact: 8, severity: 'low' },
      
      // Servers
      { id: 'server-001', label: 'Server', name: 'GPU Cluster 01', status: 'healthy', health: 0.87, cpu: 0.65, ram: 0.78, gpu: 0.92 },
      { id: 'server-002', label: 'Server', name: 'CPU Pool Alpha', status: 'warning', health: 0.62, cpu: 0.89, ram: 0.45, gpu: 0 },
      { id: 'server-003', label: 'Server', name: 'Memory Bank', status: 'healthy', health: 0.94, cpu: 0.32, ram: 0.88, gpu: 0 },
    ];

    const links = [
      // Agent depends on Task
      { source: 'agent-001', target: 'task-001', type: 'DEPENDS_ON', properties: { blocking: true } },
      { source: 'agent-002', target: 'task-002', type: 'DEPENDS_ON', properties: { blocking: false } },
      { source: 'agent-003', target: 'task-003', type: 'DEPENDS_ON', properties: { blocking: true } },
      { source: 'agent-006', target: 'task-004', type: 'DEPENDS_ON', properties: { blocking: false } },
      
      // Task blocks Task
      { source: 'task-001', target: 'task-003', type: 'BLOCKS', properties: { cascade: true } },
      { source: 'task-003', target: 'task-002', type: 'BLOCKS', properties: { cascade: false } },
      
      // Agent runs on Server
      { source: 'agent-001', target: 'server-001', type: 'RUNS_ON', properties: { resourceUsage: 0.72 } },
      { source: 'agent-002', target: 'server-002', type: 'RUNS_ON', properties: { resourceUsage: 0.85 } },
      { source: 'agent-003', target: 'server-001', type: 'RUNS_ON', properties: { resourceUsage: 0.65 } },
      { source: 'agent-004', target: 'server-002', type: 'RUNS_ON', properties: { resourceUsage: 0.95 } },
      { source: 'agent-008', target: 'server-001', type: 'RUNS_ON', properties: { resourceUsage: 0.78 } },
      
      // Agent sends data to Agent
      { source: 'agent-001', target: 'agent-003', type: 'SENDS_TO', properties: { dataType: 'embeddings', bytesPerSec: 1024 } },
      { source: 'agent-002', target: 'agent-006', type: 'SENDS_TO', properties: { dataType: 'vectors', bytesPerSec: 2048 } },
      { source: 'agent-003', target: 'agent-008', type: 'SENDS_TO', properties: { dataType: 'results', bytesPerSec: 512 } },
      { source: 'agent-006', target: 'agent-001', type: 'SENDS_TO', properties: { dataType: 'metadata', bytesPerSec: 256 } },
      
      // Server connects to Server
      { source: 'server-001', target: 'server-002', type: 'CONNECTED_TO', properties: { bandwidth: 10000, latency: 2 } },
      { source: 'server-002', target: 'server-003', type: 'CONNECTED_TO', properties: { bandwidth: 5000, latency: 5 } },
    ];

    // Color mapping
    const nodeColors = {
      'RUN': '#00ff88',
      'HOT': '#ffaa00',
      'ERR': '#ff4444',
      'HOLD': '#00ccff',
      'IDLE': '#666666',
      'BLOCKED': '#ff6600',
      'READY': '#00ff00',
      'healthy': '#00ccff',
      'warning': '#ffaa00',
      'critical': '#ff4444'
    };

    const linkColors = {
      'DEPENDS_ON': '#ff6600',
      'RUNS_ON': '#00ccff',
      'SENDS_TO': '#00ff88',
      'BLOCKS': '#ff4444',
      'CONNECTED_TO': '#888888'
    };

    // Calculate total particles
    let totalParticles = 0;
    links.forEach(link => {
      if (link.type === 'SENDS_TO') {
        totalParticles += Math.ceil(link.properties.bytesPerSec / 500);
      } else if (link.type === 'DEPENDS_ON') {
        totalParticles += link.properties.blocking ? 3 : 1;
      } else {
        totalParticles += 1;
      }
    });

    // Update stats
    document.getElementById('nodeCount').textContent = nodes.length;
    document.getElementById('linkCount').textContent = links.length;
    document.getElementById('particleCount').textContent = totalParticles;

    // Initialize graph
    const elem = document.getElementById('graph');
    const Graph = ForceGraph3D()(elem)
      .graphData({ nodes, links })
      .backgroundColor('#0a0a1a')
      .showNavInfo(false)
      
      // Node configuration
      .nodeVal(node => {
        switch(node.label) {
          case 'Agent': return (node.metrics?.tokensPerSec || 0) / 100;
          case 'Task': return node.impact || 5;
          case 'Server': return (node.health || 0.5) * 20;
          default: return 5;
        }
      })
      .nodeColor(node => nodeColors[node.status] || '#666666')
      .nodeOpacity(0.9)
      .nodeResolution(16)
      .nodeThreeObject(node => {
        // Create glowing sphere for nodes
        const geometry = new THREE.SphereGeometry(1, 32, 32);
        const material = new THREE.MeshBasicMaterial({ 
          color: nodeColors[node.status] || '#666666',
          transparent: true,
          opacity: 0.9
        });
        return new THREE.Mesh(geometry, material);
      })
      
      // Link configuration
      .linkColor(link => linkColors[link.type] || '#444444')
      .linkWidth(1.5)
      .linkOpacity(0.6)
      .linkDirectionalParticles(link => {
        if (link.type === 'SENDS_TO') {
          return Math.ceil(link.properties.bytesPerSec / 500);
        }
        if (link.type === 'DEPENDS_ON') {
          return link.properties.blocking ? 3 : 1;
        }
        if (link.type === 'BLOCKS') {
          return 2;
        }
        return 1;
      })
      .linkDirectionalParticleWidth(3)
      .linkDirectionalParticleSpeed(0.005)
      .linkDirectionalParticleColor(() => '#00ffff')
      .linkDirectionalArrowLength(5)
      .linkDirectionalArrowRelPos(1)
      
      // Force configuration
      .d3AlphaDecay(0.02)
      .d3VelocityDecay(0.3)
      .warmupTicks(100)
      .cooldownTicks(100);

    // FPS counter
    let frameCount = 0;
    let lastTime = performance.now();
    
    function updateFPS() {
      frameCount++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        document.getElementById('fps').textContent = frameCount;
        frameCount = 0;
        lastTime = now;
      }
      requestAnimationFrame(updateFPS);
    }
    updateFPS();

    // Click handler for nodes
    Graph.onNodeClick(node => {
      console.log('Node clicked:', node);
      // Could open detail panel here
    });

    // Resize handler
    window.addEventListener('resize', () => {
      Graph.width(window.innerWidth).height(window.innerHeight);
    });
  </script>
</body>
</html>
