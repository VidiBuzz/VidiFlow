<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --cyan: #00e5ff;
    --violet: #a78bfa;
    --panel: rgba(13, 20, 38, 0.92);
    --ink: #e5f6ff;
    --dim: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 360px;
    background: #0b0f1e;
    color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--panel);
    border-bottom: 1px solid rgba(0, 229, 255, 0.25);
  }
  header img { width: 28px; height: 28px; border-radius: 7px; }
  header h1 { font-size: 15px; letter-spacing: 0.5px; }
  header h1 span { color: var(--cyan); }
  header .count {
    margin-left: auto;
    color: var(--cyan);
    border: 1px solid rgba(0, 229, 255, 0.4);
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
  }
  section { padding: 12px 14px; }
  h2 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--violet);
    margin-bottom: 8px;
  }
  #searchBox {
    width: 100%;
    background: rgba(0, 229, 255, 0.06);
    border: 1px solid rgba(0, 229, 255, 0.35);
    border-radius: 8px;
    color: var(--ink);
    padding: 8px 10px;
    font-size: 13px;
    outline: none;
  }
  #searchBox:focus { border-color: var(--cyan); }
  #searchResults { margin-top: 8px; max-height: 180px; overflow-y: auto; }
  .hit {
    border: 1px solid rgba(167, 139, 250, 0.25);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
    background: rgba(167, 139, 250, 0.06);
  }
  .hit .acr { color: var(--cyan); font-weight: 700; }
  .hit .full { color: var(--violet); font-weight: 600; margin-left: 6px; }
  .hit .one { color: var(--dim); margin-top: 4px; }
  .note-item {
    border: 1px solid rgba(0, 229, 255, 0.25);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    background: rgba(0, 229, 255, 0.05);
  }
  .note-item .row1 { display: flex; align-items: baseline; gap: 6px; }
  .note-item .acr { color: var(--cyan); font-weight: 700; }
  .note-item .full { color: var(--violet); font-size: 11px; }
  .note-item .del {
    margin-left: auto;
    background: none;
    border: none;
    color: #f87171;
    cursor: pointer;
    font-size: 12px;
  }
  .note-item .meta { color: var(--dim); font-size: 10px; margin: 4px 0; word-break: break-all; }
  .note-item textarea {
    width: 100%;
    background: rgba(11, 15, 30, 0.7);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 6px;
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    padding: 4px 6px;
    resize: vertical;
    min-height: 26px;
  }
  #exportBtn {
    width: 100%;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    border: none;
    border-radius: 8px;
    color: #0b0f1e;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 0;
  }
  #exportBtn:disabled { opacity: 0.5; cursor: default; }
  .empty { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="Lexi">
    <h1>Le<span>xi</span></h1>
    <span class="count" id="stackCount">0 saved</span>
  </header>
  <section style="background:rgba(168,85,247,0.08);border-bottom:1px solid rgba(168,85,247,0.25);padding:10px 14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
      <span style="color:var(--violet);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">✨ VidiTwins Broadcast</span>
      <span style="font-size:10px;background:rgba(0,229,255,0.15);color:var(--cyan);border-radius:4px;padding:1px 6px;">Live Desk</span>
    </div>
    <p style="color:#cbd5e1;font-size:11.5px;line-height:1.4;margin-bottom:6px;">Lexi translates the tech speak into plain English. Max constructs your Smart Stack live.</p>
    <a href="https://vidismart.com/viditwin.html" target="_blank" style="display:inline-block;color:var(--cyan);font-size:11px;font-weight:700;text-decoration:none;">Open Lexi & Max Anchor Desk ↗</a>
  </section>
  <section>
    <h2>Dictionary lookup</h2>
    <input id="searchBox" type="text" placeholder="Search acronyms, e.g. CRM, RAG, JIT...">
    <div id="searchResults"></div>
  </section>
  <section>
    <h2>Smart Stack Saved Terms</h2>
    <div id="stackList"></div>
  </section>
  <section>
    <button id="exportBtn">Export study package</button>
  </section>
  <script src="data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
