<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="675" fill="#0b0f1e"/>
  <circle cx="52" cy="40" r="7" fill="#ef4444"/>
  <text x="72" y="46" font-size="17" font-weight="bold" fill="#e2e8f0">What a CRM actually is &#8212; the whole story</text>
  <text x="1148" y="46" font-size="13" font-weight="bold" fill="#00e5ff" text-anchor="end" letter-spacing="2">TRAILER &#183; 0:30</text>
  <line x1="0" y1="62" x2="1200" y2="62" stroke="#1e293b"/>
  <text x="600" y="150" font-size="42" font-weight="900" fill="#e2e8f0" text-anchor="middle" font-family="Georgia, serif">&#8220;Meet your CRM.&#8221;</text>
  <text x="600" y="192" font-size="17" fill="#94a3b8" text-anchor="middle">Every lead, every call, every follow-up &#8212; one system of record.</text>
  <!-- pipeline -->
  <g>
    <circle cx="300" cy="330" r="60" fill="rgba(0,229,255,0.08)" stroke="#00e5ff" stroke-opacity="0.6" stroke-width="2"/>
    <text x="300" y="324" font-size="26" text-anchor="middle" fill="#00e5ff">&#128100;</text>
    <text x="300" y="354" font-size="14" font-weight="bold" fill="#00e5ff" text-anchor="middle" letter-spacing="1">LEAD IN</text>
    <path d="M370 330h130" stroke="#00e5ff" stroke-width="2.5" marker-end="url(#ah)"/>
    <circle cx="600" cy="330" r="60" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2"/>
    <text x="600" y="324" font-size="26" text-anchor="middle" fill="#a78bfa">&#128200;</text>
    <text x="600" y="354" font-size="14" font-weight="bold" fill="#a78bfa" text-anchor="middle" letter-spacing="1">DEAL MOVING</text>
    <path d="M670 330h130" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ah2)"/>
    <circle cx="900" cy="330" r="60" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-opacity="0.6" stroke-width="2"/>
    <text x="900" y="324" font-size="26" text-anchor="middle" fill="#34d399">&#10003;</text>
    <text x="900" y="354" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle" letter-spacing="1">CLOSED</text>
  </g>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#00e5ff" stroke-width="1.5"/></marker>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#a78bfa" stroke-width="1.5"/></marker>
  </defs>
  <!-- under-annotation -->
  <rect x="220" y="440" width="760" height="120" rx="18" fill="#0f172b" stroke="#1e293b"/>
  <text x="600" y="490" font-size="17" fill="#cbd5e1" text-anchor="middle">A digital address book with a memory &#8212; prospects, deals, calls,</text>
  <text x="600" y="520" font-size="17" fill="#cbd5e1" text-anchor="middle">texts and emails in one place, so nobody drops a customer.</text>
  <rect x="0" y="640" width="1200" height="8" fill="#1e293b"/>
  <rect x="0" y="640" width="150" height="8" fill="#a78bfa"/>
</svg>