version: '3.7'

services:
  directus:
    image: directus/directus:10.9.1
    ports:
      - "8055:8055"
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    environment:
      KEY: ${KEY}
      SECRET: ${SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_CLIENT: ${DB_CLIENT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_ENABLED: ${CACHE_ENABLED}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}
      # CORS Configuration — allow both local dev and production origins
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:3000,http://localhost:3001,http://localhost:8080,https://vidismart.com,https://www.vidismart.com,http://localhost:8055,https://vidicrm.com"
      CORS_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      CORS_ALLOWED_HEADERS: "Content-Type,Authorization,Origin,Accept,X-Requested-With"
      CORS_CREDENTIALS: "true"
      CORS_MAX_AGE: "86400"
      # Content Security Policy
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_ANCESTORS: "*"

  db:
    image: postgres:15
    volumes:
      - ./database:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}