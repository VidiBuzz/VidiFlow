# Directus Schema Definition for AI Community Site
# This represents the content types/models that would be created in Directus

collections:
  ai_companies:
    icon: building
    note: "Directory of AI companies and ML development firms"
    fields:
      - field: name
        type: string
        interface: input
        note: "Company name"
        required: true
      - field: business_type
        type: string
        interface: input
        note: "Type of AI business (e.g., AI/ML Development, AI Consulting)"
        required: true
      - field: description
        type: text
        interface: textarea
        note: "Detailed description of the company"
      - field: website
        type: string
        interface: input
        note: "Company website URL"
      - field: email
        type: string
        interface: input
        note: "Contact email"
      - field: phone
        type: string
        interface: input
        note: "Contact phone number"
      - field: address
        type: string
        interface: input
        note: "Physical address"
      - field: city
        type: string
        interface: input
        note: "City"
      - field: state
        type: string
        interface: input
        note: "State/Province"
      - field: country
        type: string
        interface: input
        note: "Country"
      - field: rating
        type: number
        interface: input
        note: "Rating (0-5 scale)"
        min: 0
        max: 5
        step: 0.1
      - field: logo
        type: file
        interface: upload
        note: "Company logo"
      - field: social_links
        type: json
        interface: json
        note: "Social media links as JSON object"
      - field: specialties
        type: string
        interface: tags
        note: "AI specialties/tags"
      - field: created_at
        type: timestamp
        interface: datetime
        note: "Record creation timestamp"
        readonly: true
      - field: updated_at
        type: timestamp
        interface: datetime
        note: "Record update timestamp"
        readonly: true

  ai_consultants:
    icon: person
    note: "Directory of AI consultants and consulting firms"
    fields:
      - field: name
        type: string
        interface: input
        note: "Consultant or company name"
        required: true
      - field: business_type
        type: string
        interface: input
        note: "Type of consulting service"
        required: true
      - field: description
        type: text
        interface: textarea
        note: "Detailed description of services"
      - field: website
        type: string
        interface: input
        note: "Website URL"
      - field: email
        type: string
        interface: input
        note: "Contact email"
      - field: phone
        type: string
        interface: input
        note: "Contact phone number"
      - field: address
        type: string
        interface: input
        note: "Physical address"
      - field: city
        type: string
        interface: input
        note: "City"
      - field: state
        type: string
        interface: input
        note: "State/Province"
      - field: country
        type: string
        interface: input
        note: "Country"
      - field: rating
        type: number
        interface: input
        note: "Rating (0-5 scale)"
        min: 0
        max: 5
        step: 0.1
      - field: logo
        type: file
        interface: upload
        note: "Consultant logo"
      - field: social_links
        type: json
        interface: json
        note: "Social media links as JSON object"
      - field: specialties
        type: string
        interface: tags
        note: "AI specialties/tags"
      - field: hourly_rate
        type: string
        interface: input
        note: "Hourly rate or pricing information"
      - field: availability
        type: string
        interface: input
        note: "Availability status"
      - field: created_at
        type: timestamp
        interface: datetime
        note: "Record creation timestamp"
        readonly: true
      - field: updated_at
        type: timestamp
        interface: datetime
        note: "Record update timestamp"
        readonly: true

  articles:
    icon: chat
    note: "AI articles, blog posts, and resources"
    fields:
      - field: title
        type: string
        interface: input
        note: "Article title"
        required: true
      - field: slug
        type: string
        interface: input
        note: "URL slug"
        required: true
      - field: content
        type: text
        interface: wysiwyg
        note: "Article content"
      - field: excerpt
        type: text
        interface: input
        note: "Short excerpt/summary"
      - field: featured_image
        type: file
        interface: upload
        note: "Featured image"
      - field: author
        type: string
        interface: input
        note: "Author name"
      - field: publish_date
        type: datetime
        interface: datetime
        note: "Publication date"
      - field: status
        type: string
        interface: dropdown
        note: "Publication status"
        options:
          - draft
          - published
          - archived
        default: draft
      - field: tags
        type: string
        interface: tags
        note: "Article tags"
      - field: category
        type: string
        interface: dropdown
        note: "Content category"
        options:
          - news
          - tutorial
          - research
          - opinion
          - case-study
      - field: created_at
        type: timestamp
        interface: datetime
        note: "Record creation timestamp"
        readonly: true
      - field: updated_at
        type: timestamp
        interface: datetime
        note: "Record update timestamp"
        readonly: true

  events:
    icon: calendar
    note: "AI events, conferences, and meetups"
    fields:
      - field: title
        type: string
        interface: input
        note: "Event title"
        required: true
      - field: description
        type: text
        interface: textarea
        note: "Event description"
      - field: start_date
        type: datetime
        interface: datetime
        note: "Event start date/time"
        required: true
      - field: end_date
        type: datetime
        interface: datetime
        note: "Event end date/time"
      - field: location
        type: string
        interface: input
        note: "Event location (physical or virtual)"
      - field: url
        type: string
        interface: input
        note: "Event website or registration URL"
      - field: image
        type: file
        interface: upload
        note: "Event image"
      - field: is_virtual
        type: boolean
        interface: toggle
        note: "Is this a virtual event?"
        default: false
      - field: created_at
        type: timestamp
        interface: datetime
        note: "Record creation timestamp"
        readonly: true
      - field: updated_at
        type: timestamp
        interface: datetime
        note: "Record update timestamp"
        readonly: true

  forum_posts:
    icon: comment
    note: "Community forum discussions"
    fields:
      - field: title
        type: string
        interface: input
        note: "Post title"
        required: true
      - field: content
        type: text
        interface: wysiwyg
        note: "Post content"
      - field: author
        type: string
        interface: input
        note: "Author name"
      - field: category
        type: string
        interface: dropdown
        note: "Forum category"
        options:
          - general
          - news
          - projects
          - learning
          - ethics
          - jobs
      - field: tags
        type: string
        interface: tags
        note: "Post tags"
      - field: sticky
        type: boolean
        interface: toggle
        note: "Stick to top of category"
        default: false
      - field: locked
        type: boolean
        interface: toggle
        note: "Lock post (no replies)"
        default: false
      - field: created_at
        type: timestamp
        interface: datetime
        note: "Record creation timestamp"
        readonly: true
      - field: updated_at
        type: timestamp
        interface: datetime
        note: "Record update timestamp"
        readonly: true