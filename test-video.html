<!DOCTYPE html>
<html>
<head>
    <title>Video Diagnostic Test</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        video { width: 80%; max-width: 800px; border: 2px solid #0f0; }
        .status { margin-top: 20px; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>Video Diagnostic Player</h1>
    <p>Directly testing URL: <code>https://cdn.vidi.news/The_Visual_AI_Smart_Stack.mp4</code></p>
    
    <!-- SIMPLEST POSSIBLE VIDEO TAG -->
    <video controls autoplay playsinline>
        <source src="https://cdn.vidi.news/The_Visual_AI_Smart_Stack.mp4?v=finaldiagnose" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="status">
        Attempting to load... <br>
        (If this plays past 10 seconds, the URL is good.)
    </div>
</body>
</html>
